const FR = {"½":0.5,"¼":0.25,"¾":0.75};
const num = s => parseFloat(String(s).replace(",", "."));

function parseAmount(s){
  s = String(s ?? "").trim();
  let m = s.match(/^(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if (m) return {qty:num(m[1]), qty2:num(m[2]), unit:m[3]};
  m = s.match(/^(\d+(?:[.,]\d+)?)?\s*([½¼¾])?\s*(.*)$/);
  if (m && (m[1] || m[2])) return {qty:(m[1] ? num(m[1]) : 0) + (m[2] ? FR[m[2]] : 0), qty2:null, unit:m[3]};
  return {qty:null, qty2:null, unit:s};
}
function fmt(x, unit){
  const u = norm(unit).split(" ")[0];
  if (["g","gr","gram","ml"].includes(u)){
    const step = x >= 100 ? 10 : 5;
    return String(Math.max(step, Math.round(x / step) * step));
  }
  let q = Math.round(x * 4) / 4; if (q <= 0) q = 0.25;
  const w = Math.floor(q), fr = q - w;
  const F = {0.25:"¼",0.5:"½",0.75:"¾"};
  return fr ? (w ? w + F[fr] : F[fr]) : String(w);
}
function amountText(m, f){
  if (m.qty == null) return m.unit || "";
  let t = fmt(m.qty * f, m.unit);
  if (m.qty2 != null) t += "–" + fmt(m.qty2 * f, m.unit);
  return t + (m.unit ? " " + m.unit : "");
}

/* ---------- Pişirme modu ---------- */
let wakeLock = null, wakeState = "";
async function requestWake(){
  try {
    if (!("wakeLock" in navigator)) throw new Error("yok");
    wakeLock = await navigator.wakeLock.request("screen");
    wakeState = "on";
  } catch(e){ wakeState = "off"; }
  const w = $("cookWake"); if (w) w.textContent = wakeText();
}
function wakeText(){
  if (wakeState === "on") return "Pişirme modu açıkken ekranın kapanmayacak.";
  if (wakeState === "off") return "Bu tarayıcı ekranı açık tutamıyor; gerekirse telefonunun ekran kapanma süresini uzat.";
  return "";
}
function releaseWake(){ try { if (wakeLock) wakeLock.release(); } catch(e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (cook.open && document.visibilityState === "visible") requestWake(); });

function stepMinutes(s){
  let m = s.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*dakika/i);
  if (m) return parseInt(m[1], 10);
  m = s.match(/(\d+)\s*saat/i);
  if (m) return parseInt(m[1], 10) * 60;
  return 0;
}
function openCook(key, resume){
  if (!REG.has(key)) return;
  if (!resume || cook.key !== key) cook = {open:true, key, step:0, counted:false};
  cook.open = true;
  addRecent(key);
  $("cook").hidden = false;
  document.documentElement.style.overflow = "hidden";
  requestWake();
  renderCook(); renderBar(); renderTimers();
  const nx = $("cookNext"); if (nx) nx.focus();
}
function closeCook(){
  cook.open = false;
  $("cook").hidden = true;
  document.documentElement.style.overflow = "";
  releaseWake();
  renderBar(); renderTimers();
  if (mode === "fav" || mode === "recent") renderSaved();
}

  [/küp doğra/, "🔪", "küp nasıl doğranır", "küp doğrama"],
  [/ince kıy|kıyılmış/, "🔪", "nasıl ince kıyılır", "ince kıyma"],
  [/doğra/, "🔪", "nasıl doğranır", "doğrama"],
  [/rendele/, "🧀", "nasıl rendelenir", "rendeleme"],
  [/ayıkla/, "🔪", "nasıl ayıklanır", "ayıklama"],
  [new RegExp("(^|\\s)soy(up|ulmuş)?" + W), "🔪", "nasıl soyulur", "soyma"],
  [/ılıştır/, "🥣", "terbiye nasıl ılıştırılır", "ılıştırma"],
  [new RegExp("(^|\\s)yoğur(up)?" + W), "🙌", "nasıl yoğrulur", "yoğurma"],
  [/çırp/, "🥄", "nasıl çırpılır", "çırpma"],
  [new RegExp("(^|\\s)sar(ıp|ar|ın)?" + W), "🌯", "nasıl sarılır", "sarma"],
  [/harc[ıi]\s+doldur|içini doldur/, "🥄", "nasıl doldurulur", "doldurma"],
  [/didikle/, "🍗", "nasıl didiklenir", "didikleme"],
  [/haşla/, "💧", "nasıl haşlanır", "haşlama"],
  [/kızart/, "🍳", "nasıl kızartılır", "kızartma"],
  [/sotele/, "🍳", "nasıl sotelenir", "sote"],
  [/kavur/, "🍳", "nasıl kavrulur", "kavurma"],
  [/demlen/, "⏳", "nasıl demlendirilir", "demlendirme"],
  [/ıslat/, "💧", "nasıl ıslatılır", "ıslatma"]
];
const BASIC_INGS = new Set(["tuz","su","karabiber","sıvı yağ","zeytinyağı","yağ","tereyağı"]);
function stepTechnique(r, step){
  const t = norm(step);
  let best = null, at = Infinity;
  for (const tech of TECHNIQUES){
    const i = t.search(tech[0]);
    if (i >= 0 && i < at){ best = tech; at = i; }
  }
  let emoji = best ? best[1] : "👩‍🍳";
  if (!best){
    if (/fırın/.test(t)) emoji = "🔥";
    else if (/beklet|dinlendir|soğut/.test(t)) emoji = "⏳";
    else if (/servis/.test(t)) emoji = "🍽️";
    else if (/pişir|kaynat/.test(t)) emoji = "🍲";
    else if (/ekle|karıştır/.test(t)) emoji = "🥄";
    return {emoji, query:"", label:"", kind:""};
  }
  // İlgili malzemeyi bul. Türkçede nesne fiilden önce gelir ("patlıcanları soy");
  // "kıyılmış maydanoz" gibi sıfat hâlinde ise malzeme sonra gelir.
  // teknik "doğranmış", "küp doğranmış" gibi sıfat hâlindeyse malzeme sonra gelir
  const next = t.slice(at).trim().split(/\s+/).slice(0, 2).join(" ") + " ";
  const participle = /(mış|miş|muş|müş)[.,;!]?\s/.test(next);
  let before = {ing:"", d:Infinity}, after = {ing:"", d:Infinity};
  r.malzemeler.forEach(m => {
    if (BASIC_INGS.has(norm(m.ad))) return;
    const n = norm(m.ad).split(" ").pop();
    const stem = n.length > 4 ? n.slice(0, n.length - 1) : n;
    let i = t.indexOf(stem);
    while (i >= 0){
      const wordStart = i === 0 || /[\s(,]/.test(t[i - 1]); // "suyunu" içindeki "un" gibi yanlış eşleşmeleri önle
      if (wordStart){
        if (i < at && at - i < before.d) before = {ing:n, d:at - i};
        if (i > at && i - at < after.d) after = {ing:n, d:i - at};
      }
      i = t.indexOf(stem, i + 1);
    }
  });
  let ing = participle ? (after.ing || before.ing) : (before.ing || after.ing);
  // yoğurma, ılıştırma ve demlendirmede asıl iş yemeğin kendisidir
  if (["yoğurma","ılıştırma","demlendirme"].includes(best[3])) ing = "";
  if (best[3] === "çırpma") ing = /yumurta/.test(t) ? "yumurta" : "";
  const subject = ing || norm(r.ad);
  return {emoji, query:`${subject} ${best[2]}`.trim(), label:`${ing ? ing + " " : ""}${best[3]}`, kind:best[3]};
}

const explains = (() => { const v = load("pisir-aciklama", {}); return v && typeof v === "object" ? v : {}; })();
const explainState = {};
function tipHTML(r, step, tech){
  const t = norm(step);
  const how = tech.kind && HOWTO[tech.kind];
  const terms = GLOSSARY.filter(([re]) => re.test(t)).slice(0, 3);
  const key = r.key + "|" + cook.step;
  const ex = explains[key];
  const st = explainState[key];
  let h = `<div class="tip cat-${recipeCat(r)}">`;
  if (how) h += `<p><b>💡 Nasıl yapılır?</b> ${esc(how)}</p>`;
  if (terms.length) h += terms.map(([, a, b]) => `<p class="gl"><b>${esc(a)}:</b> ${esc(b)}</p>`).join("");
  if (!how && !terms.length && !ex) h += `<p class="gl">Bu adım basit; yazılanı sırayla yapman yeterli.</p>`;
  if (Array.isArray(ex) && ex.length) h += `<p><b>🤖 Ayrıntılı anlatım</b></p><ul>${ex.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

  }
  return h + `</div>`;
}

/* ---------- Zamanlayıcılar ---------- */
let timers = [], tickId = null, audioCtx = null;
function startTimer(min){
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch(e) {}
  timers.push({id:Date.now() + Math.random(), label:`Adım ${cook.step + 1}`, end:Date.now() + min * 60000, done:false});
  if (!tickId) tickId = setInterval(tick, 1000);
  renderTimers();
}
function beep(){
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch(e) {}
  if (!audioCtx) return;
  try {
    [0, 0.45, 0.9].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const s = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.3, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.35);
      o.start(s); o.stop(s + 0.4);
    });
  } catch(e) {}
}
function tick(){
  const now = Date.now();
  timers.forEach(t => { if (!t.done && now >= t.end){ t.done = true; beep(); } });
  if (!timers.some(t => !t.done)){ clearInterval(tickId); tickId = null; }
  renderTimers();
}
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function renderTimers(){
  const now = Date.now();
  const box = $("cookTimers");
  if (box) box.innerHTML = timers.map(t => `<span class="timer ${t.done ? "done" : ""}">${t.label}: ${t.done ? "süre doldu" : mmss(t.end - now)}<button type="button" data-act="timerDismiss" data-id="${t.id}" aria-label="Zamanlayıcıyı kapat">✕</button></span>`).join("");
  const pill = $("timerPill");
  if (!timers.length || cook.open){ pill.hidden = true; return; }
  pill.hidden = false;
  const doneAny = timers.some(t => t.done);
  const active = timers.filter(t => !t.done).sort((a, b) => a.end - b.end)[0];
  pill.classList.toggle("done", doneAny);
  pill.textContent = doneAny ? "⏱️ Süre doldu, pişirmeye dön" : "⏱️ " + mmss(active.end - now);
}

  renderDishList(); renderDishDetail();
  const owned = ownedNames();
  const prompt = `Sen dünya mutfaklarını iyi bilen deneyimli bir aşçısın. Kullanıcı şu yemeği yapmak istiyor: "${q}".\nKullanıcının evdeki malzemeleri: ${owned.length ? owned.join(", ") : "belirtilmedi"}.\nYemek hangi mutfaktan olursa olsun gerçek ve uygulanabilir bir tarif ver; her şeyi Türkçe yaz. Tuz, karabiber, yağ ve su dahil tarifte kullanılan bütün malzemeleri miktarlarıyla listele. Her malzemenin "evde" alanını kullanıcının evdeki malzemelerine göre doldur.\nYalnızca şu biçimde JSON döndür, başka hiçbir şey yazma:\n${FORMAT}\nEğer "${q}" bir yemek, tatlı ya da içecek değilse yalnızca {"hata": "kısa Türkçe açıklama"} döndür.`;
  try {
    const out = await sampleFn.json(prompt);
    if (out && typeof out.hata === "string") dishState = {state:"error", query:q, msg:out.hata};
    else {
      const r = fromAI(out);
      if (r){ dishState = null; currentKey = r.key; addRecent(r.key); }
      else dishState = {state:"error", query:q, msg:"Tarif okunamadı. Tekrar dene."};
    }
  } catch(e){ dishState = {state:"error", query:q, msg:errMsg(e)}; }
  if (mode === "dish"){ renderDishList(); renderDishDetail(); }
}

async function runPantryAI(){
  const owned = ownedNames();
  if (!owned.length || !sampleFn || aiPantry.state === "loading") return;
  aiPantry = {state:"loading", keys:aiPantry.keys, msg:""};
  renderResults();
  const cons = [...filters].map(f => FILTER_PROMPT[f]);
  const prompt = `Sen dünya mutfaklarını iyi bilen deneyimli bir aşçısın. Kullanıcının evdeki malzemeleri: ${owned.join(", ")}.\nBu malzemelerin olabildiğince çoğunu kullanan ve en fazla bir iki ek malzeme gerektiren 5 farklı yemek öner.${cons.length ? " Önerilerin hepsi şu koşullara uymalı: " + cons.join(", ") + "." : ""} Türk mutfağı dahil farklı ülke mutfaklarından çeşitli seçimler yap. Gerçek ve uygulanabilir tarifler ver; her şeyi Türkçe yaz. Tuz, karabiber, yağ ve su dahil tarifte kullanılan bütün malzemeleri miktarlarıyla listele. Her malzemenin "evde" alanını kullanıcının malzemelerine göre doldur.\nYalnızca şu biçimde JSON döndür, başka hiçbir şey yazma:\n{"yemekler": [${FORMAT}]}`;
  try {
    const out = await sampleFn.json(prompt);
    const list = (out && Array.isArray(out.yemekler) ? out.yemekler : []).map(fromAI).filter(Boolean);
    aiPantry.keys.forEach(k => open.delete(k));
    if (list.length && filters.has("hizli")) list.forEach(r => { if (!r.sure) r.sure = 15; });
    aiPantry = list.length ? {state:"done", keys:list.map(r => r.key), msg:""} : {state:"error", keys:[], msg:"Öneriler okunamadı. Tekrar dene."};
  } catch(e){ aiPantry = {state:"error", keys:aiPantry.keys, msg:errMsg(e)}; }
  if (mode === "pantry") renderResults();
}

/* ---------- Görsel, ikame ve menü ---------- */
const ILLUS_ENABLED = false;
function illusHTML(r){
  const svg = illus[r.key];
  if (svg) return `<img class="dish-img" alt="${esc(r.ad)} için yapay zekâ çizimi" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}"><p class="img-cap">Yapay zekâ çizimi</p>`;
  if (!sampleFn || !ILLUS_ENABLED) return "";
  const st = illusState[r.key];
  if (st === "loading") return `<button type="button" class="img-btn" disabled>Görsel çiziliyor, bu biraz sürebilir…</button>`;
  return `<button type="button" class="img-btn" data-act="illus" data-key="${esc(r.key)}">🎨 Yemeğin görselini oluştur</button>${st === "error" ? `<p class="sub-msg">Görsel oluşturulamadı. Tekrar dene.</p>` : ""}`;
}
async function runIllus(key){
  const r = REG.get(key);
  if (!r || !sampleFn || illusState[key] === "loading") return;
  illusState[key] = "loading"; renderAll();
  const prompt = `"${r.ad}"${r.mutfak ? " (" + r.mutfak + ")" : ""} yemeğinin iştah açıcı bir illüstrasyonunu SVG olarak çiz. Başlıca malzemeleri: ${r.malzemeler.slice(0, 8).map(m => m.ad).join(", ")}.\nKurallar: kök etikette viewBox="0 0 400 260" ve xmlns="http://www.w3.org/2000/svg" olsun, width ve height verme. Yemeği bir tabakta ya da kapta, hafif üstten açıyla, gerçek renklerine sadık ve tanınabilir şekilde göster. Sıcak ve doygun renkler, yumuşak gölgeler ve gradyanlar kullanabilirsin. Arka plan sade bir masa yüzeyi olsun. Hiçbir yazı, harf, logo ya da insan figürü olmasın. script, foreignObject, olay öznitelikleri ve dış bağlantılar kullanma. Kod 12 KB'ı geçmesin.\nYalnızca <svg ile başlayıp </svg> ile biten kodu döndür, başka hiçbir şey yazma.`;
  try {
    const res = await sampleFn(prompt, {modelTier:"default"});
    const m = String(res && res.text || "").match(/<svg[\s\S]*<\/svg>/i);
    if (!m || m[0].length > 80000) throw new Error("svg yok");
    let svg = m[0].replace(/<script[\s\S]*?<\/script>/gi, "").replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, "");
    if (!/xmlns=/.test(svg)) svg = svg.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    illus[key] = svg;
    const ks = Object.keys(illus); while (ks.length > 25) delete illus[ks.shift()];
    delete illusState[key]; save();
  } catch(e){ illusState[key] = "error"; }
  renderAll();
}

function substHTML(r, m){
  const s = subs[r.key + "|" + norm(m.ad)]; if (!s) return "";
  if (s.state === "loading") return `<p class="sub-msg">Alternatifler aranıyor…</p>`;
  if (s.state === "error") return `<p class="sub-msg">${esc(s.msg)}</p>`;
  if (!s.items.length) return `<p class="sub-msg">${esc(s.note || "Bu malzeme için uygun bir alternatif bulunamadı.")}</p>`;
  return `<ul class="subs">${s.items.map(x => `<li><strong>${esc(x.ne)}</strong>: ${esc(x.nasil)}</li>`).join("")}</ul>`;
}
async function runSubst(r, m){
  const k = r.key + "|" + norm(m.ad);
  if (!sampleFn || (subs[k] && subs[k].state === "loading")) return;
  subs[k] = {state:"loading"}; renderAll();
  const a = amountText(m, getServ(r) / (r.kisi || 4));
  const own = ownedNames();
  const prompt = `Bir kullanıcı "${r.ad}" yapmak istiyor ama tarifteki "${m.ad}"${a ? " (" + a + ")" : ""} malzemesi evde yok.\nEvdeki malzemeleri: ${own.length ? own.join(", ") : "belirtilmedi"}.\nBu malzemenin yerine kullanılabilecek en fazla 3 pratik alternatif öner; mümkünse önce kullanıcının evdeki malzemelerinden seç. Her öneri için ne kullanılacağını ve ne kadar, nasıl kullanılacağını kısa ve Türkçe yaz. Malzeme tarifte zorunlu değilse çıkarmayı da bir seçenek olarak önerebilirsin. Yemeğin tadını çok değiştirecek bir değişiklikse bunu belirt.\nYalnızca şu JSON'u döndür: {"oneriler": [{"ne": "kullanılacak malzeme", "nasil": "miktarı ve nasıl kullanılacağı"}], "not": "uygun alternatif yoksa kısa açıklama, varsa boş metin"}`;
  try {
    const out = await sampleFn.json(prompt, {modelTier:"quick"});
    const items = (out && Array.isArray(out.oneriler) ? out.oneriler : []).filter(x => x && typeof x.ne === "string").slice(0, 3).map(x => ({ne:x.ne, nasil:str(x.nasil)}));
    subs[k] = {state:"done", items, note:str(out && out.not)};
    saveSubs();
  } catch(e){ subs[k] = {state:"error", msg:errMsg(e).replace("Tarif oluşturulamadı", "Öneri alınamadı")}; }
  renderAll();
}

function planCtl(r){
  const ek = esc(r.key);
  if (planTarget !== null) return `<button type="button" class="ai-btn" data-act="planAdd" data-key="${ek}">${DAYS[planTarget]} menüsüne ekle</button>`;
  const ok = lastPlanMsg && lastPlanMsg.key === r.key ? `<span class="plan-ok">✓ ${DAYS[lastPlanMsg.day]} menüsüne eklendi</span>` : "";
  return `<select class="plan-sel" data-plan-key="${ek}" aria-label="Haftalık menüye ekle"><option value="">Menüye ekle…</option>${DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>${ok}`;
}
function renderBanner(){
  $("planBanner").innerHTML = planTarget !== null
    ? `<div class="banner"><span>${DAYS[planTarget]} için bir yemek seç, sonra “${DAYS[planTarget]} menüsüne ekle”ye dokun.</span><button type="button" data-act="planCancel">Vazgeç</button></div>`
    : "";
}
function planShopping(){
  const map = new Map();
  plan.forEach(day => day.forEach(k => {
    const r = REG.get(k); if (!r) return;
    const f = getServ(r) / (r.kisi || 4);
    r.malzemeler.forEach(m => {
      if (owned(m)) return;
      const id = m.id || norm(m.ad);
      let e = map.get(id);
      if (!e){ e = {id, m, ad:m.ad, amounts:new Map(), free:[], dishes:new Set()}; map.set(id, e); }
      if (m.qty != null){ const u = m.unit || ""; e.amounts.set(u, (e.amounts.get(u) || 0) + m.qty * f); }
      else if (m.unit) e.free.push(m.unit);
      e.dishes.add(r.ad);
    });
  }));
  return [...map.values()].map(e => ({...e, amountText:[...[...e.amounts].map(([u, q]) => fmt(q, u) + (u ? " " + u : "")), ...e.free].join(" + ")}));
}
function planShopText(){
  return "Haftalık alışveriş listesi:\n" + planShopping().map(e => "- " + e.ad + (e.amountText ? " (" + e.amountText + ")" : "")).join("\n");
}
function renderPlan(){
  const total = plan.reduce((n, d) => n + d.length, 0);
  let h = `<div class="plan-grid">${DAYS.map((d, i) => `<div class="day"><div class="day-head"><h3>${d}</h3><button type="button" class="link-btn" data-act="planPick" data-day="${i}">+ Yemek ekle</button></div>${
    plan[i].length
      ? `<ul class="day-list">${plan[i].map((k, j) => { const r = REG.get(k); return r ? `<li><button type="button" class="day-item" data-act="openSaved" data-key="${esc(k)}">${esc(r.ad)} <span class="amt">${getServ(r)} kişilik</span></button><button type="button" class="x" data-act="planRemove" data-day="${i}" data-idx="${j}" aria-label="${esc(r.ad)} yemeğini kaldır">✕</button></li>` : ""; }).join("")}</ul>`
      : `<p class="sub" style="margin:0">Henüz yemek yok.</p>`
  }</div>`).join("")}</div>`;
  if (!total){
    h += `<div class="empty">Menün boş. Bir güne “+ Yemek ekle” ile başla ya da herhangi bir tarifteki “Menüye ekle” seçeneğini kullan.</div>`;
  } else {
    const list = planShopping();
    h += `<div class="section"><div class="actions" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">Haftalık alışveriş listen</h2><button type="button" class="fav" data-act="planClear">Menüyü temizle</button></div>`;
    h += list.length
      ? `<p class="sub">Menündeki ${total} yemeğin eksikleri tek listede. Aldıkça “Aldım”a dokun.</p><ul class="need">${list.map(e => `<li><div class="need-row"><span>${esc(e.ad)}${e.amountText ? ` <span class="amt">${esc(e.amountText)}</span>` : ""}<span class="for">${esc([...e.dishes].join(", "))} için</span></span><button type="button" class="state buy" data-act="bought" data-k="${esc(e.id)}">Aldım</button></div></li>`).join("")}</ul><button type="button" class="ai-btn" data-act="copyPlan" style="margin-top:14px">Listeyi kopyala</button>`
      : `<p class="done">Menündeki tüm yemeklerin malzemeleri evde, alışverişe gerek yok!</p>`;
    h += `</div>`;
  }
  $("planMode").innerHTML = h;
}

/* ---------- Olaylar ---------- */
function addExtra(){
  const raw = $("search").value.trim(); if (!raw) return;
  extras.add(cap(raw)); $("search").value = ""; save(); renderAll();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const key = el.dataset.key;
  const r = key ? REG.get(key) : null;
  switch (act){
    case "tab": mode = el.dataset.mode; if (mode !== "dish"){ planTarget = null; filters = new Set(); } renderAll(); break;
    case "filter": {
      const f = el.dataset.f;
      if (mode !== "dish"){
        // başka bir sekmedeyken kategoriye basılırsa "Yemek ara"da o kategoriyi aç
        mode = "dish"; planTarget = null; filters = new Set([f]); $("dishSearch").value = "";
        renderAll(); $("filters").scrollIntoView({block:"start"});
      } else {
        filters = (filters.has(f) && filters.size === 1) ? new Set() : new Set([f]); // tek seçim
        renderAll();
      }
      break;
    }
    case "ing": { const id = el.dataset.id; selected.has(id) ? selected.delete(id) : selected.add(id); save(); renderAll(); break; }
    case "addExtra": addExtra(); break;
    case "rmExtra": extras.delete(el.dataset.name); save(); renderAll(); break;
    case "clear": selected.clear(); extras.clear(); manual = {}; open.clear(); aiPantry = {state:"idle", keys:[], msg:""}; save(); renderAll(); break;
    case "toResults": $("results").scrollIntoView(); break;
    case "expand": if (open.has(key)) open.delete(key); else { open.add(key); addRecent(key); } renderResults(); break;
    case "pickDish": dishState = null; currentKey = key; addRecent(key); renderDishList(); renderDishDetail(); $("dishDetail").scrollIntoView({block:"start"}); break;
    case "pickCat": filters = new Set([el.dataset.f]); $("dishSearch").value = ""; renderAll(); break;
    case "aiDish": runDishAI(); break;
    case "aiSuggest": runPantryAI(); break;
    case "own": if (r){ toggleOwn(r.malzemeler[Number(el.dataset.idx)]); save(); renderAll(); } break;
    case "fav": if (r){ favs = favs.includes(key) ? favs.filter(k => k !== key) : [key, ...favs]; save(); renderAll(); } break;
    case "servMinus": case "servPlus": if (r){ servMap[key] = Math.min(12, Math.max(1, getServ(r) + (act === "servPlus" ? 1 : -1))); save(); renderAll(); } break;
    case "copy": if (r) copyText(shopText(r), el); break;
    case "openSaved": mode = "dish"; $("dishSearch").value = ""; dishState = null; currentKey = key; addRecent(key); renderAll(); window.scrollTo(0, 0); break;
    case "selectGroup": { const g = GROUPS[Number(el.dataset.g)]; const all = g.items.every(([id]) => selected.has(id)); g.items.forEach(([id]) => all ? selected.delete(id) : selected.add(id)); save(); renderAll(); break; }
    case "subst": if (r) runSubst(r, r.malzemeler[Number(el.dataset.idx)]); break;
    case "illus": runIllus(key); break;
    case "planAdd": if (r && planTarget !== null){ plan[planTarget].push(key); planTarget = null; mode = "plan"; save(); renderAll(); window.scrollTo(0, 0); } break;
    case "planPick": planTarget = Number(el.dataset.day); mode = "dish"; $("dishSearch").value = ""; currentKey = null; dishState = null; renderAll(); window.scrollTo(0, 0); break;
    case "planCancel": planTarget = null; mode = "plan"; renderAll(); break;
    case "planRemove": plan[Number(el.dataset.day)].splice(Number(el.dataset.idx), 1); save(); renderAll(); break;
    case "planClear": plan = plan.map(() => []); save(); renderAll(); break;
    case "bought": { const it = planShopping().find(x => x.id === el.dataset.k); if (it){ if (it.m.id) selected.add(it.m.id); if (LABEL[it.id]) selected.add(it.id); manual[norm(it.ad)] = true; save(); renderAll(); } break; }
    case "copyPlan": copyText(planShopText(), el); break;
    case "explainStep": runExplain(); break;
    case "clearRecent": recents = []; save(); renderAll(); break;
    case "cook": openCook(key, false); break;
    case "cookOpen": if (cook.key) openCook(cook.key, true); break;
    case "cookClose": closeCook(); break;
    case "cookPrev": cook.step = Math.max(0, cook.step - 1); renderCook(); break;
    case "cookNext": cook.step += 1; renderCook(); break;
    case "timer": startTimer(Number(el.dataset.min)); break;
    case "timerDismiss": timers = timers.filter(t => String(t.id) !== el.dataset.id); renderTimers(); break;
  }
});

document.addEventListener("change", e => {
  const s = e.target.closest("select[data-plan-key]"); if (!s || s.value === "") return;
  const key = s.dataset.planKey, day = Number(s.value);
  if (!REG.has(key)) return;
  plan[day].push(key); lastPlanMsg = {key, day}; save(); renderAll();
});
$("search").addEventListener("input", renderGroups);
$("search").addEventListener("keydown", e => { if (e.key === "Enter" && $("addExtra")) addExtra(); });
$("dishSearch").addEventListener("input", renderDishList);
$("dishSearch").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = norm($("dishSearch").value); if (!q) return;
  const list = BUILTIN.filter(r => norm(r.ad).includes(q) && fpass(r));
  if (list.length === 1){ dishState = null; currentKey = list[0].key; addRecent(currentKey); renderDishList(); renderDishDetail(); }
  else if (!list.length) runDishAI();
});
document.addEventListener("keydown", e => {
  if (!cook.open) return;
  const r = REG.get(cook.key); if (!r) return;
  if (e.key === "Escape") closeCook();
  else if (e.key === "ArrowRight" && cook.step < r.adimlar.length){ cook.step++; renderCook(); }
  else if (e.key === "ArrowLeft" && cook.step > 0){ cook.step--; renderCook(); }
});

/* ---------- Yapay zekâ (Cloudflare Worker + Gemini) ----------
   AI_URL: Cloudflare Worker adresin. Boş bırakılırsa yapay zekâ özellikleri gizlenir, uygulama yine çalışır.
   AI_DAILY_LIMIT: her cihazın günlük yapay zekâ isteği sınırı (ücretsiz kotayı korur). */
const AI_URL = "https://ne-pisirsem-ai.erdemgursoy07.workers.dev";
const AI_DAILY_LIMIT = 0; // 0 = sınır yok. Cihaz başına sınır koymak istersen buraya bir sayı yaz.

function aiQuota(){
  const today = new Date().toDateString();
  const q = load("pisir-ai-kota-v2", null);
  return q && q.day === today && typeof q.count === "number" ? q : {day:today, count:0};
}
/* Aynı anda en fazla 2 yapay zekâ isteği gönderilir; fazlası sırada bekler (ücretsiz kotayı korur). */
const AI_PARALLEL = 2;
let aiActive = 0;
const aiWaiting = [];
const aiSlot = () => new Promise(res => { if (aiActive < AI_PARALLEL){ aiActive++; res(); } else aiWaiting.push(res); });
const aiRelease = () => { const next = aiWaiting.shift(); if (next) next(); else aiActive--; };

async function aiCall(prompt, wantJson){
  if (!navigator.onLine) throw {code:"offline"};
  if (AI_DAILY_LIMIT > 0 && aiQuota().count >= AI_DAILY_LIMIT) throw {code:"daily_limit"};
  await aiSlot();
  try {
    for (let attempt = 0; ; attempt++){
      let res;
      try {
        res = await fetch(AI_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt, json:!!wantJson})});
      } catch(e){ throw {code: navigator.onLine ? "unreachable" : "offline"}; }
      if (!res.ok){
        const d = await res.json().catch(() => null);
        // Yoğunlukta bir kez birkaç saniye bekleyip yeniden dene
        if (res.status === 429 && attempt === 0){ await new Promise(r => setTimeout(r, 4000)); continue; }
        throw {code: res.status === 429 ? "rate_limited" : "server", detail: d && (d.detail || d.error)};
      }
      const data = await res.json().catch(() => null);
      if (!data || typeof data.text !== "string") throw {code:"server"};
      // Yalnızca başarılı istekler günlük hakkından düşülür
      const q = aiQuota(); q.count += 1;
      try { localStorage.setItem("pisir-ai-kota-v2", JSON.stringify(q)); } catch(e) {}
      return data.text;
    }
  } finally { aiRelease(); }
}
if (AI_URL){
  sampleFn = async (prompt) => ({text: await aiCall(prompt, false)});
  sampleFn.json = async (prompt) => {
    const text = await aiCall(prompt, true);
    try { return JSON.parse(text.replace(/```json|```/g, "").trim()); }
    catch(e){ throw {code:"server"}; }
  };
  renderAll();
}

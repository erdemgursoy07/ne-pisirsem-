<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Evdeki malzemelerden yemek önerisi, alışveriş listesi, pişirme modu ve haftalık menü.">
<meta name="theme-color" content="#1E4FA8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ne pişirsem?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bugün ne pişirsem?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#13223F; --muted:#5A6782; --line:#D9E1EC;
  --cobalt:#1E4FA8; --cobalt-ink:#FFFFFF; --turq:#1C7E79; --turq-soft:#E1F2F0;
  --red:#C2362B; --red-soft:#FBE7E4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1528; --surface:#16213A; --ink:#E8EEF8; --muted:#9AA7C0; --line:#2A3858;
    --cobalt:#7EA6F2; --cobalt-ink:#0D1528; --turq:#5CC8BF; --turq-soft:#16343A;
    --red:#F08A7E; --red-soft:#3A2028;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1528; --surface:#16213A; --ink:#E8EEF8; --muted:#9AA7C0; --line:#2A3858;
  --cobalt:#7EA6F2; --cobalt-ink:#0D1528; --turq:#5CC8BF; --turq-soft:#16343A;
  --red:#F08A7E; --red-soft:#3A2028;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;
}
button{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* Kategori renkleri */
:root{
  --c-corba:#D9480F; --c-corba-bg:#FFF0E5;
  --c-etli:#C92A2A; --c-etli-bg:#FFEAEA;
  --c-etsiz:#2B8A3E; --c-etsiz-bg:#E8F7EC;
  --c-sebze:#0B7A6E; --c-sebze-bg:#E2F6F2;
  --c-kahvalti:#9C6500; --c-kahvalti-bg:#FFF5D1;
  --c-tatli:#C2255C; --c-tatli-bg:#FFE9F3;
  --c-hizli:#5F3DC4; --c-hizli-bg:#F0EBFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --c-corba:#FFA94D; --c-corba-bg:#3A2416;
    --c-etli:#FF8787; --c-etli-bg:#3B1F22;
    --c-etsiz:#69DB7C; --c-etsiz-bg:#17301F;
    --c-sebze:#63E6BE; --c-sebze-bg:#12302C;
    --c-kahvalti:#FFD43B; --c-kahvalti-bg:#332A10;
    --c-tatli:#F783AC; --c-tatli-bg:#3A1A2A;
    --c-hizli:#B197FC; --c-hizli-bg:#241D3D;
  }
}
:root[data-theme="dark"]{
  --c-corba:#FFA94D; --c-corba-bg:#3A2416;
  --c-etli:#FF8787; --c-etli-bg:#3B1F22;
  --c-etsiz:#69DB7C; --c-etsiz-bg:#17301F;
  --c-sebze:#63E6BE; --c-sebze-bg:#12302C;
  --c-kahvalti:#FFD43B; --c-kahvalti-bg:#332A10;
  --c-tatli:#F783AC; --c-tatli-bg:#3A1A2A;
  --c-hizli:#B197FC; --c-hizli-bg:#241D3D;
}
.cat-corba{--c:var(--c-corba);--cbg:var(--c-corba-bg)}
.cat-etli{--c:var(--c-etli);--cbg:var(--c-etli-bg)}
.cat-etsiz{--c:var(--c-etsiz);--cbg:var(--c-etsiz-bg)}
.cat-sebze{--c:var(--c-sebze);--cbg:var(--c-sebze-bg)}
.cat-kahvalti{--c:var(--c-kahvalti);--cbg:var(--c-kahvalti-bg)}
.cat-tatli{--c:var(--c-tatli);--cbg:var(--c-tatli-bg)}
.cat-hizli{--c:var(--c-hizli);--cbg:var(--c-hizli-bg)}
.cat-populer{--c:#1C64C8;--cbg:#E7F0FF}
.cat-kahve{--c:#7A4A1E;--cbg:#F6ECE1}
.cat-meze{--c:#5A7A12;--cbg:#EEF6DF}
.cat-dunya{--c:#0E7490;--cbg:#E0F4F8}

.marquee{overflow:hidden;margin:0 0 14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;width:max-content;animation:kay 45s linear infinite}
.marquee-track span{font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.3;white-space:nowrap;padding-right:.6em;word-spacing:.35em}
@keyframes kay{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}
.yt-btn{display:inline-flex;align-items:center;gap:6px;background:#E62117;color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;text-decoration:none}
.yt-btn:hover{background:#C4170F}
.yt-btn.yt-alt{background:transparent;color:#E62117;border:2px solid #E62117;padding:9px 14px}
.yt-btn.yt-alt:hover{background:#FFF0EF}
.filters.cats{display:flex;flex-wrap:nowrap;gap:10px;margin-top:18px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:100px;padding:14px 12px;border-radius:20px;border:2.5px solid transparent;background:var(--cbg);color:var(--c);font-weight:700;cursor:pointer;flex:0 0 auto;transition:transform .12s,border-color .12s}
.cat:hover{transform:translateY(-2px)}
.cat-emo{font-size:2rem;line-height:1}
.cat-name{font-size:.88rem;white-space:nowrap}
.cat[aria-pressed="true"]{border-color:var(--c)}

.dish-list{display:block !important;margin:16px 0 30px}
.hints{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.hint{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--cbg);color:var(--c);font-weight:700;border:0;cursor:pointer;font-size:1rem}
.hint small{font-weight:600;opacity:.85}
.dish-sec h2{font-size:1.3rem;font-weight:800;margin:24px 0 12px;display:flex;gap:8px;align-items:center}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dish-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:20px;background:var(--cbg);border:2.5px solid transparent;cursor:pointer;text-align:left;color:var(--ink);transition:transform .12s}
.dish-card:hover{transform:translateY(-2px)}
.dish-card[aria-pressed="true"]{border-color:var(--c)}
.dc-emo{font-size:2.3rem;line-height:1}
.dc-name{font-weight:700;line-height:1.2}
.dc-time{font-size:.85rem;color:var(--c);font-weight:700}
.emo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--cbg);font-size:1.55rem;flex:0 0 auto}
.rh{display:flex;align-items:center;gap:12px}
.big-emo{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:26px;background:var(--cbg);font-size:3rem;margin-bottom:12px}

.band{
  height:14px;
  background:
    radial-gradient(circle at 12px 7px,var(--red) 0 3.5px,transparent 4.5px) 0 0/24px 14px,
    radial-gradient(circle at 0 7px,var(--turq) 0 3px,transparent 4px) 0 0/24px 14px,
    var(--cobalt);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(2.6rem,8vw,5.2rem);line-height:.95;letter-spacing:-.03em;font-weight:800;margin:0 0 16px;max-width:13ch}
.hero p{margin:0;color:var(--muted);max-width:52ch;font-size:1.08rem}
.status{margin-top:18px;font-size:1.25rem;font-weight:500;min-height:1.9em}
.status strong{font-weight:800;color:var(--cobalt)}

.tabs{display:inline-flex;gap:4px;padding:4px;margin-top:20px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{background:var(--cobalt);color:var(--cobalt-ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip.filter{padding:7px 13px;font-size:.95rem}
.chip.filter[aria-pressed="true"]{background:var(--turq);border-color:var(--turq);color:var(--surface)}

.layout{display:grid;gap:32px;padding-bottom:120px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start;padding-bottom:64px}
  .results{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1 1 220px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search::placeholder{color:var(--muted)}
.clear{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.clear:hover{border-color:var(--red);color:var(--red)}
.group{margin-bottom:22px}
.group h2{font-size:1rem;font-weight:700;margin:0 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--cobalt)}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.staples{font-size:.92rem;color:var(--muted);margin-top:4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.98rem}
.add-row{margin:-6px 0 22px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.add-row .sub{margin:0}

.results h2,.saved h2,.plan h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.section{margin-bottom:30px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted)}
.recipe{border-top:1.5px solid var(--line)}
.recipe:last-child{border-bottom:1.5px solid var(--line)}
.recipe-head,.saved-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:14px 2px;cursor:pointer;text-align:left}
.saved-row{border-top:1.5px solid var(--line)}
.saved-list .saved-row:last-child{border-bottom:1.5px solid var(--line)}
.recipe-name{font-size:1.2rem;font-weight:700}
.recipe-meta{color:var(--muted);font-size:.92rem;white-space:nowrap}
.cuisine{display:block;font-size:.9rem;color:var(--muted)}
.missing{display:block;font-size:.92rem;color:var(--red);font-weight:500;margin-top:2px}
.recipe-body{padding:4px 2px 22px}
.recipe-body h3{font-size:1.05rem}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 22px}
.ai-btn{background:var(--cobalt);color:var(--cobalt-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.fav{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.fav[aria-pressed="true"]{color:var(--red);border-color:var(--red)}
.serv{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.serv button{border:0;background:transparent;width:42px;height:42px;font-size:1.3rem;font-weight:700;cursor:pointer}
.serv span{padding:0 6px;font-weight:600;min-width:82px;text-align:center;font-variant-numeric:tabular-nums}

.dish{max-width:760px;padding-bottom:64px}
.saved{max-width:760px;padding-bottom:64px}
.dish-input{width:100%;font-size:1.15rem;padding:16px 18px}
.dish-list{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 30px}
.ai-row{flex-basis:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:12px}
.ai-row .sub{margin:0}
.detail h2{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 6px}
.detail h3,.recipe-body h3{font-weight:700;margin:0 0 8px}
.detail h3{font-size:1.15rem}
.need{list-style:none;padding:0;margin:0 0 8px}
.need li{padding:10px 2px;border-top:1.5px solid var(--line)}
.need-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.need-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.need li:last-child{border-bottom:1.5px solid var(--line)}
.amt{color:var(--muted);font-size:.92rem}
.state{border:0;border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.9rem;font-weight:600;white-space:nowrap}
.state.have{background:var(--turq-soft);color:var(--turq)}
.state.buy{background:var(--red-soft);color:var(--red)}
.shop{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin:22px 0 28px}
.shop ul{margin:0 0 14px;padding-left:1.2em}
.done{color:var(--turq);font-weight:600;margin:22px 0 28px}
.steps{margin:0;padding-left:1.4em}
.steps li{margin-bottom:6px;max-width:60ch}
.note{font-size:.92rem;color:var(--muted);margin:10px 0 0}
.ai-box{border-top:3px solid var(--cobalt);padding-top:18px}
.ai-tag{display:inline-block;font-size:.85rem;font-weight:600;color:var(--cobalt);border:1.5px solid var(--cobalt);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.loading{color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateY(110%);transition:transform .2s}
.bar.show{transform:none}
.bar button{background:var(--cobalt);color:var(--cobalt-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer}
@media (min-width:900px){.bar{display:none}}

.pill{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:40;border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--turq);color:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(13,21,40,.25)}
.pill.done{background:var(--red)}

.cook{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 16px)}
.cook-inner{max-width:780px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cook-top{display:flex;align-items:center;gap:12px}
.cook-close{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer}
.cook-title{flex:1;font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-count{color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.cook-progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.cook-progress span{display:block;height:100%;background:var(--cobalt);transition:width .25s}
.cook-timers{display:flex;flex-wrap:wrap;gap:8px}
.timer{display:inline-flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;border-radius:999px;background:var(--turq-soft);color:var(--turq);font-weight:700;font-variant-numeric:tabular-nums}
.timer.done{background:var(--red-soft);color:var(--red)}
.timer button{border:0;background:transparent;color:inherit;cursor:pointer;font-weight:700;padding:2px 8px}
.cook-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:12px 0}
.cook-step{font-size:clamp(1.65rem,5.6vw,2.7rem);line-height:1.22;font-weight:600;letter-spacing:-.01em;margin:0}
.cook-timer-btn{font-size:1.1rem;padding:14px 20px}
.cook-actions{display:flex;flex-wrap:wrap;gap:12px}
.tip{background:var(--cbg);border-radius:18px;padding:16px 18px;font-size:1.02rem;line-height:1.55}
.tip p{margin:0 0 8px}
.tip p:last-child{margin-bottom:0}
.tip b{color:var(--c)}
.tip .gl{font-size:.95rem}
.tip ul{margin:4px 0 8px;padding-left:1.2em}
.tip li{margin-bottom:4px}
.explain-btn{border:0;background:var(--surface);color:var(--c);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;margin-top:4px}
.cook-how{font-size:1.1rem;padding:14px 20px}
.cook-how{flex-direction:column;align-items:flex-start;gap:2px}
.cook-how small{font-weight:600;opacity:.9;font-size:.85rem}
.step-emo{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:28px;background:var(--cbg);font-size:3.4rem;line-height:1}
.cook-yt{padding:8px 12px;font-size:.9rem;white-space:nowrap}

.cook-ings summary{cursor:pointer;font-weight:600;color:var(--muted);padding:6px 0}
.cook-ings ul{margin:8px 0 0;padding-left:1.2em}
.cook-wake{font-size:.9rem;color:var(--muted);margin:0}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.cook-nav button{padding:20px;font-size:1.2rem;border-radius:16px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.cook-nav .primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.cook-finish{font-size:clamp(2.4rem,9vw,4.5rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.group-head{display:flex;gap:14px;align-items:baseline}
.link-btn{border:0;background:none;color:var(--cobalt);font-weight:700;cursor:pointer;padding:4px 0}
.sub-btn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.subs{margin:8px 0 2px;padding:10px 14px 10px 30px;background:var(--surface);border-radius:12px;border:1.5px solid var(--line);font-size:.95rem}
.subs li{margin-bottom:4px}
.sub-msg{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.dish-img{width:100%;max-width:520px;aspect-ratio:400/260;display:block;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);margin:0 0 6px;object-fit:cover}
.img-cap{font-size:.82rem;color:var(--muted);margin:0 0 16px}
.img-btn{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;margin:0 0 18px;width:100%;max-width:520px;text-align:left;color:var(--muted)}
.plan-sel{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.plan-ok{color:var(--turq);font-weight:600;font-size:.95rem}
.plan{max-width:1040px;padding-bottom:64px}
.plan-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:32px}
.day{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.day-head h3{margin:0;font-size:1.1rem}
.day-list{list-style:none;margin:0;padding:0}
.day-list li{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line)}

<script>
/* ---------- Veri ---------- */
const GROUPS = [
  {title:"🧂 Temel malzemeler", all:true, items:[["tuz","Tuz"],["karabiber","Karabiber"],["yag","Sıvı yağ"],["zeytinyagi","Zeytinyağı"],["su","Su"]]},
  {title:"🥕 Sebze ve yeşillik", items:[["domates","Domates"],["sogan","Soğan"],["sarimsak","Sarımsak"],["biber","Biber"],["kapya","Kapya biber"],["patates","Patates"],["patlican","Patlıcan"],["kabak","Kabak"],["havuc","Havuç"],["ispanak","Ispanak"],["taze_fasulye","Taze fasulye"],["salatalik","Salatalık"],["maydanoz","Maydanoz"],["dereotu","Dereotu"],["marul","Marul"],["limon","Limon"],["mantar","Mantar"],["bezelye","Bezelye"],["lahana","Lahana"],["pirasa","Pırasa"],["balkabagi","Bal kabağı"],["asma_yapragi","Asma yaprağı"]]},
  {title:"🍎 Meyve", items:[["elma","Elma"],["muz","Muz"],["cilek","Çilek"],["avokado","Avokado"]]},
  {title:"🍗 Et, tavuk ve balık", items:[["kusbasi","Kuşbaşı et"],["kiyma","Kıyma"],["tavuk","Tavuk"],["sucuk","Sucuk"],["pastirma","Pastırma"],["balik","Balık"]]},
  {title:"🌾 Bakliyat, tahıl ve hamur", items:[["pirinc","Pirinç"],["bulgur","Bulgur"],["mercimek","Kırmızı mercimek"],["yesil_mercimek","Yeşil mercimek"],["nohut","Nohut"],["kuru_fasulye","Kuru fasulye"],["fava","Kuru bakla"],["makarna","Makarna"],["lazanya","Lazanya yaprağı"],["pirinc_eriste","Pirinç eriştesi"],["sehriye","Şehriye"],["un","Un"],["irmik","İrmik"],["ekmek","Ekmek"],["hamburger_ekmegi","Hamburger ekmeği"],["lavas","Lavaş / tortilla"],["yufka","Yufka"],["baklava_yufkasi","Baklavalık yufka"]]},
  {title:"🧀 Süt ürünleri ve yumurta", items:[["yumurta","Yumurta"],["sut","Süt"],["yogurt","Yoğurt"],["peynir","Beyaz peynir"],["kasar","Kaşar"],["mozzarella","Mozzarella"],["labne","Labne peyniri"],["krema","Sıvı krema"],["tereyagi","Tereyağı"],["dondurma","Vanilyalı dondurma"]]},
  {title:"☕️ Kahve", items:[["turk_kahvesi","Türk kahvesi"],["espresso","Espresso kahvesi"],["filtre_kahve","Filtre kahve"],["granul_kahve","Granül kahve"],["buz","Buz"]]},
  {title:"🍫 Tatlı malzemeleri", items:[["seker","Şeker"],["kakao","Kakao"],["cikolata","Bitter çikolata"],["vanilin","Vanilin"],["tarcin","Tarçın"],["bal","Bal"],["nisasta","Nişasta"],["biskuvi","Bisküvi"],["ceviz","Ceviz"],["fistik","Yer fıstığı"],["maya","Kuru maya"],["kabartma_tozu","Kabartma tozu"]]},
  {title:"🥫 Dolap", items:[["salca","Salça"],["nane","Kuru nane"],["pul_biber","Pul biber"],["kori","Köri baharatı"],["tahin","Tahin"],["nar_eksisi","Nar ekşisi"],["soya_sosu","Soya sosu"],["mayonez","Mayonez"],["tursu","Kornişon turşu"],["zeytin","Zeytin"]]}
];
const LABEL = {};
GROUPS.forEach(g => g.items.forEach(([id,l]) => LABEL[id] = l));

const RAW = [
  {n:"Menemen", t:15, p:2, tag:["kahvalti"], k:["yumurta:4 adet","domates:3 adet","biber:3 adet"], s:["Biberleri doğrayıp yağda birkaç dakika sotele.","Küp doğranmış domatesi ekle, suyunu çekene kadar pişir.","Yumurtaları kır, hafifçe karıştırarak istediğin kıvama gelene kadar pişir.","Tuz ve karabiberle tatlandırıp sıcak servis et."]},
  {n:"Sucuklu yumurta", t:10, p:2, tag:["kahvalti"], k:["sucuk:100 g","yumurta:4 adet"], s:["Sucuğu dilimleyip yağsız tavada hafifçe çevir.","Yumurtaları sucukların arasına kır.","Kapağını kapatıp beyazları pişene kadar kısık ateşte 3 dakika beklet."]},
  {n:"Peynirli omlet", t:10, p:1, tag:["kahvalti"], k:["yumurta:2 adet","peynir:40 g"], s:["Yumurtaları tuzla çırp.","Yağlı tavaya dök, üzerine ufaladığın peyniri serp.","İkiye katlayıp kısık ateşte pişir."]},
  {n:"Ispanaklı yumurta", t:20, p:2, tag:["kahvalti"], k:["ispanak:500 g","yumurta:3 adet","sogan:1 adet"], s:["Soğanı yağda kavur.","Doğranmış ıspanağı ekleyip sönene kadar pişir.","Yumurtaları kır, kapağı kapalı olarak 5 dakika pişir."]},
  {n:"Mercimek çorbası", t:35, p:4, tag:["corba"], k:["mercimek:1 su bardağı","sogan:1 adet","havuc:1 adet"], s:["Soğan ve havucu doğrayıp yağda kavur.","Yıkanmış mercimeği ve yaklaşık 6 su bardağı sıcak suyu ekle.","Mercimek dağılana kadar 25 dakika kadar pişir.","Blenderdan geçir, tuzunu ayarla; istersen limonla servis et."]},
  {n:"Ezogelin çorbası", t:40, p:4, tag:["corba"], k:["mercimek:1 su bardağı","bulgur:2 yemek kaşığı","sogan:1 adet","salca:1 yemek kaşığı","nane:1 tatlı kaşığı"], s:["Soğanı yağda kavurup salçayı ekle.","Mercimek ve bulguru ekleyip 7 su bardağı sıcak su ilave et.","Bulgur yumuşayana kadar yaklaşık 30 dakika pişir.","Nane ve tuzla tatlandırıp servis et."]},
  {n:"Yayla çorbası", t:35, p:4, tag:["corba"], k:["yogurt:1.5 su bardağı","pirinc:0.5 su bardağı","yumurta:1 adet","un:1 yemek kaşığı","nane:1 tatlı kaşığı"], s:["Pirinci 6 su bardağı suda yumuşayana kadar yaklaşık 15 dakika haşla.","Yoğurt, yumurta ve unu ayrı bir kapta çırp.","Çorbanın suyundan azar azar ekleyerek karışımı ılıştır, sonra tencereye ekle.","Kaynayınca yağda kızdırılmış naneyi üzerine gezdir."]},
  {n:"Tavuk şehriye çorbası", t:45, p:4, tag:["corba"], k:["tavuk:300 g","sehriye:0.5 su bardağı","havuc:1 adet"], s:["Tavuğu 6 su bardağı suda 25 dakika haşla, suyunu ayır ve etini didikle.","Tavuk suyuna küçük doğranmış havucu ekleyip 10 dakika pişir.","Şehriyeyi ve tavuğu ekle, şehriye yumuşayınca ocaktan al."]},
  {n:"Pirinç pilavı", t:30, p:4, k:["pirinc:2 su bardağı","tereyagi:2 yemek kaşığı"], s:["Pirinci ılık suda bekletip süz.","Tereyağında pirinci şeffaflaşana kadar kavur.","Pirincin 1,5 katı sıcak su ve tuz ekle, suyunu çekene kadar kısık ateşte pişir.","Ocaktan alıp 10 dakika demlenmeye bırak."]},
  {n:"Tavuklu pilav", t:50, p:4, k:["tavuk:400 g","pirinc:2 su bardağı","tereyagi:2 yemek kaşığı"], s:["Tavuğu 25 dakika haşla, suyunu sakla ve etini didikle.","Pirinci tereyağında kavur.","3 su bardağı tavuk suyunu ekleyip suyunu çekene kadar pişir.","Üzerine didiklenmiş tavuğu koyup servis et."]},
  {n:"Bulgur pilavı", t:30, p:4, k:["bulgur:2 su bardağı","sogan:1 adet","salca:1 yemek kaşığı","biber:2 adet"], s:["Soğan ve biberi yağda kavur, salçayı ekle.","Bulguru ekleyip birkaç dakika çevir.","Bulgurun 2 katı sıcak su ve tuz ekle, suyunu çekene kadar pişir.","10 dakika demlendirip servis et."]},
  {n:"Kısır", t:25, p:6, tag:["kahvalti"], k:["bulgur:2 su bardağı","salca:2 yemek kaşığı","maydanoz:1 demet","limon:1 adet","sogan:1 adet"], s:["İnce bulguru 1,5 su bardağı sıcak suyla ıslatıp kapağını kapat, 15 dakika beklet.","Salça ve biraz yağ ekleyip iyice yoğur.","İnce kıyılmış soğan, maydanoz ve limon suyunu ekleyip karıştır."]},
  {n:"Karnıyarık", t:60, p:4, k:["patlican:6 adet","kiyma:250 g","sogan:1 adet","domates:2 adet","biber:3 adet"], s:["Patlıcanları alacalı soyup yağda ya da fırında yumuşayana kadar pişir.","Soğan, biber ve kıymayı kavurup doğranmış domatesin yarısını ekle.","Patlıcanların ortasını yarıp harcı doldur, üstüne kalan domatesi koy.","Yarım su bardağı sıcak su ekleyip 180 °C fırında 25 dakika pişir."]},
  {n:"Musakka", t:60, p:4, k:["patlican:4 adet","kiyma:250 g","sogan:1 adet","domates:2 adet"], s:["Patlıcanları halka doğrayıp kızart ya da fırında pişir.","Soğan ve kıymayı kavurup doğranmış domatesi ekle.","Patlıcanları ve kıymalı harcı katman katman diz.","Yarım su bardağı sıcak suyla 180 °C fırında 25 dakika pişir."]},
  {n:"Kabak mücveri", t:30, p:4, tag:["kahvalti"], k:["kabak:3 adet","yumurta:2 adet","un:4 yemek kaşığı","peynir:100 g","maydanoz:0.5 demet"], s:["Kabakları rendeleyip suyunu iyice sık.","Yumurta, ufalanmış peynir, kıyılmış maydanoz ve unu ekleyip karıştır.","Kızgın yağa kaşıkla dökerek iki yüzünü kızart.","Kâğıt havluda yağını alıp servis et."]},
  {n:"Patates yemeği", t:35, p:4, k:["patates:5 adet","sogan:1 adet","salca:1 yemek kaşığı"], s:["Soğanı yağda kavurup salçayı ekle.","Küp doğranmış patatesleri ekleyip birkaç dakika çevir.","Üzerini geçecek kadar sıcak su ve tuz ekle, patatesler yumuşayana kadar 20 dakika pişir."]},
  {n:"Kıymalı patates", t:40, p:4, k:["patates:4 adet","kiyma:250 g","sogan:1 adet","salca:1 yemek kaşığı"], s:["Soğanı ve kıymayı kavur, salçayı ekle.","Küp doğranmış patatesleri ekleyip karıştır.","2 su bardağı sıcak su ekleyip patatesler yumuşayana kadar yaklaşık 25 dakika pişir."]},
  {n:"Fırında tavuk ve patates", t:60, p:4, k:["tavuk:800 g","patates:4 adet","salca:1 yemek kaşığı"], s:["Patatesleri iri doğra, tavuk parçalarıyla fırın kabına yerleştir.","Salça, yağ, tuz ve baharatı yarım su bardağı suyla karıştırıp üzerine dök.","180 °C fırında tavuk kızarana kadar 45–50 dakika pişir."]},
  {n:"Tavuk sote", t:30, p:4, k:["tavuk:500 g","biber:3 adet","domates:2 adet","sogan:1 adet"], s:["Tavuğu küp doğrayıp yüksek ateşte suyunu çekene kadar sotele.","Soğan ve biberi ekleyip birkaç dakika çevir.","Domatesi ekle, 10 dakika kadar pişirip servis et."]},
  {n:"Köfte", t:30, p:4, k:["kiyma:500 g","sogan:1 adet","ekmek:2 dilim"], s:["Bayat ekmeği ıslatıp suyunu sık.","Kıyma, rendelenmiş soğan, ekmek, tuz ve baharatı iyice yoğur.","Şekil verip tavada ya da ızgarada iki yüzünü pişir."]},
  {n:"Nohut yemeği", t:35, p:4, k:["nohut:2 su bardağı","sogan:1 adet","salca:1 yemek kaşığı"], s:["Soğanı yağda kavurup salçayı ekle.","Haşlanmış nohutu ve üzerini geçecek kadar sıcak su ekle.","Kısık ateşte 20 dakika pişir."], note:"Kuru nohutu bir gece önceden ıslatıp haşlaman gerekir."},
  {n:"Kuru fasulye", t:45, p:4, k:["kuru_fasulye:2 su bardağı","sogan:1 adet","salca:1 yemek kaşığı"], s:["Soğanı yağda kavurup salçayı ekle.","Haşlanmış fasulyeyi ve üzerini geçecek kadar sıcak su ekle.","Kısık ateşte fasulyeler iyice yumuşayana kadar 30 dakika pişir."], note:"Fasulyeyi bir gece önceden ıslatıp haşlaman gerekir."},
  {n:"Zeytinyağlı taze fasulye", t:50, p:4, k:["taze_fasulye:500 g","sogan:1 adet","domates:2 adet"], s:["Soğanı zeytinyağında kavur.","Ayıklanmış fasulyeleri ve doğranmış domatesi ekle.","Yarım su bardağı su ve tuz ekleyip kısık ateşte 40 dakika pişir.","Soğuyunca servis et."]},
  {n:"Yoğurtlu makarna", t:15, p:4, k:["makarna:500 g","yogurt:2 su bardağı","sarimsak:2 diş"], s:["Makarnayı tuzlu suda 10 dakika haşla.","Yoğurda ezilmiş sarımsak ekle.","Makarnanın üzerine yoğurdu dök; istersen pul biberli yağ gezdir."]},
  {n:"Domates soslu makarna", t:20, p:4, k:["makarna:500 g","domates:4 adet","sarimsak:2 diş"], s:["Sarımsağı yağda hafifçe kavur.","Rendelenmiş domatesi ekleyip koyulaşana kadar 10 dakika pişir.","Haşlanmış makarnayı sosla karıştır."]},
  {n:"Cacık", t:10, p:4, k:["yogurt:2 su bardağı","salatalik:2 adet","sarimsak:1 diş","nane:1 tatlı kaşığı"], s:["Salatalığı rendele ya da küçük doğra.","Yoğurdu biraz suyla aç, ezilmiş sarımsağı ekle.","Salatalığı ekle, nane ve tuzla tatlandır."]},
  {n:"Havuç tarator", t:15, p:4, k:["havuc:3 adet","yogurt:1 su bardağı","sarimsak:1 diş"], s:["Havucu rendeleyip biraz yağda yumuşayana kadar sotele.","Soğuyunca sarımsaklı yoğurtla karıştır."]},
  {n:"Çoban salatası", t:10, p:4, tag:["kahvalti"], k:["domates:3 adet","salatalik:2 adet","sogan:1 adet","biber:2 adet","maydanoz:0.5 demet"], s:["Domates, salatalık, biber ve soğanı küçük küp doğra.","Kıyılmış maydanozu ekle.","Zeytinyağı, tuz ve varsa limonla karıştır."]},
  {n:"Patates salatası", t:30, p:4, k:["patates:4 adet","sogan:1 adet","maydanoz:0.5 demet","limon:1 adet"], s:["Patatesleri 20 dakika haşlayıp küp doğra.","İnce doğranmış soğan ve maydanozu ekle.","Limon suyu, zeytinyağı ve tuzla karıştır."]},
  {n:"Sigara böreği", t:30, p:4, tag:["kahvalti"], k:["yufka:2 adet","peynir:200 g","maydanoz:0.5 demet"], s:["Peyniri ufalayıp kıyılmış maydanozla karıştır.","Yufkayı üçgenlere kes, geniş kenarına harç koyup sigara gibi sar.","Uçlarını suyla yapıştırıp kızgın yağda kızart."]},
  {n:"Kaşarlı tost", t:10, p:1, tag:["kahvalti"], k:["ekmek:2 dilim","kasar:2 dilim"], s:["Ekmek dilimlerinin arasına kaşar koy.","Tost makinesinde ya da tavada iki yüzü kızarana kadar pişir."]},
  {n:"Yumurtalı ekmek", t:15, p:2, tag:["kahvalti"], k:["ekmek:4 dilim","yumurta:2 adet","sut:0.5 su bardağı"], s:["Yumurta ve sütü tuzla çırp.","Ekmek dilimlerini karışıma batır.","Kızgın yağda iki yüzünü kızart."]},
  {n:"Krep", t:25, p:4, tag:["kahvalti","tatli"], k:["un:1 su bardağı","sut:1.5 su bardağı","yumurta:2 adet"], s:["Un, süt ve yumurtayı pürüzsüz olana kadar çırp.","Yağlanmış tavaya ince bir kat dök.","Altı kızarınca çevir; tatlı ya da tuzlu bir iç ile servis et."]},
  {n:"Sütlaç", t:45, p:4, tag:["tatli"], k:["pirinc:0.5 su bardağı","sut:1 litre","seker:1 su bardağı"], s:["Pirinci 1 su bardağı suda yumuşayana kadar 10 dakika haşla.","Sütü ekleyip karıştırarak kaynat.","Şekeri ekle, koyulaşana kadar karıştırarak 20 dakika pişir.","Kaselere paylaştırıp soğut."]},
  {n:"Muhallebi", t:25, p:4, tag:["tatli"], k:["sut:1 litre","un:4 yemek kaşığı","seker:1 su bardağı"], s:["Süt, un ve şekeri soğukken tencerede çırparak karıştır.","Orta ateşte sürekli karıştırarak koyulaşana kadar pişir.","Kaynamaya başlayınca 3 dakika daha karıştırıp ocaktan al.","Kaselere paylaştır, soğuyunca buzdolabına koy."]},
  {n:"İrmik helvası", t:35, p:4, tag:["tatli"], k:["irmik:1 su bardağı","tereyagi:3 yemek kaşığı","sut:2 su bardağı","seker:1 su bardağı"], s:["Sütü ve şekeri bir tencerede şeker eriyene kadar ısıt.","Başka bir tencerede tereyağını erit, irmiği ekle.","İrmiği kısık ateşte rengi dönene kadar yaklaşık 15 dakika kavur.","Sıcak sütü dikkatlice ekle, suyunu çekene kadar karıştır ve 10 dakika demlendir."], note:"Süt eklerken buhar çıkar, yüzünü tencereden uzak tut."},
  {n:"Un kurabiyesi", t:40, p:6, tag:["tatli"], k:["un:2.5 su bardağı","tereyagi:250 g","seker:1 su bardağı"], s:["Oda sıcaklığındaki tereyağı ile şekeri krema kıvamına gelene kadar çırp.","Unu azar azar ekleyip ele yapışmayan bir hamur yoğur.","Ceviz büyüklüğünde parçalar koparıp yuvarla.","170 °C fırında altı hafifçe renk alana kadar 15–20 dakika pişir."], note:"Toz şeker yerine pudra şekeri kullanırsan daha yumuşak olur."},
  {n:"Tas kebabı", t:75, p:4, k:["kusbasi:500 g","sogan:2 adet","domates:2 adet","salca:1 yemek kaşığı","tereyagi:1 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:3 su bardağı"], s:["Eti tereyağında suyunu salıp çekene kadar kavur.","Doğranmış soğanı ekleyip pembeleşene kadar çevir.","Salçayı ve küp doğranmış domatesi ekle.","3 su bardağı sıcak su ekleyip et yumuşayana kadar kısık ateşte 50 dakika pişir.","Tuz ve karabiberle tatlandır, pilavla servis et."]},
  {n:"Et sote", t:45, p:4, k:["kusbasi:500 g","biber:3 adet","domates:2 adet","sogan:1 adet","tereyagi:1 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Eti yüksek ateşte suyunu çekene kadar sotele.","Soğan ve biberi ekleyip 5 dakika çevir.","Domatesi ekle, kapağı kapalı kısık ateşte 25 dakika pişir.","Tereyağı, tuz ve karabiberi ekleyip servis et."]},
  {n:"Etli nohut", t:70, p:4, k:["kusbasi:300 g","nohut:2 su bardağı","sogan:1 adet","salca:1 yemek kaşığı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:4 su bardağı"], s:["Eti yağda suyunu çekene kadar kavur.","Soğanı ve salçayı ekleyip birkaç dakika çevir.","Haşlanmış nohutu ve 4 su bardağı sıcak suyu ekle.","Et ve nohut iyice yumuşayana kadar kısık ateşte 40 dakika pişir."], note:"Kuru nohutu bir gece önceden ıslatıp haşlaman gerekir."},
  {n:"İzmir köfte", t:60, p:4, k:["kiyma:500 g","ekmek:2 dilim","sogan:1 adet","patates:3 adet","biber:3 adet","domates:2 adet","salca:1 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","yag:1 su bardağı","su:1.5 su bardağı"], s:["Kıyma, ıslatılmış ekmek, rendelenmiş soğan, tuz ve karabiberi yoğurup uzun köfteler yap.","Köfteleri ve parmak doğranmış patatesleri yağda hafifçe kızart.","Fırın kabına köfte, patates, biber ve domates dilimlerini sırayla diz.","Salçayı 1,5 su bardağı sıcak suyla açıp üzerine dök.","180 °C fırında 30 dakika pişir."]},
  {n:"Tavuk şiş", t:40, p:4, k:["tavuk:500 g","yogurt:3 yemek kaşığı","salca:1 yemek kaşığı","sarimsak:2 diş","zeytinyagi:2 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Tavuğu küp doğra.","Yoğurt, salça, ezilmiş sarımsak, zeytinyağı, tuz ve karabiberle karıştırıp 30 dakika beklet.","Şişlere diz.","Izgarada ya da tavada çevirerek 10 dakika pişir."]},
  {n:"Domates çorbası", t:25, p:4, tag:["corba"], k:["domates:5 adet","un:2 yemek kaşığı","tereyagi:2 yemek kaşığı","sut:1 su bardağı","tuz:1 tatlı kaşığı","su:4 su bardağı"], s:["Tereyağında unu kokusu çıkana kadar kavur.","Rendelenmiş domatesi ekleyip 5 dakika pişir.","4 su bardağı sıcak suyu ekle, 10 dakika kaynat.","Sütü azar azar ekle, tuzla tatlandır ve bir taşım daha kaynat."]},
  {n:"Şehriye çorbası", t:20, p:4, tag:["corba"], k:["sehriye:0.5 su bardağı","salca:1 yemek kaşığı","tereyagi:1 yemek kaşığı","limon:0.5 adet","tuz:1 tatlı kaşığı","su:6 su bardağı"], s:["Tereyağında salçayı kavur.","6 su bardağı sıcak suyu ekleyip kaynat.","Şehriyeyi ekle, yumuşayana kadar 10 dakika pişir.","Tuz ve limonla tatlandırıp servis et."]},
  {n:"Sebze çorbası", t:35, p:4, tag:["corba"], k:["patates:2 adet","havuc:2 adet","kabak:1 adet","sogan:1 adet","tereyagi:1 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:6 su bardağı"], s:["Soğanı tereyağında kavur.","Küp doğranmış patates, havuç ve kabağı ekleyip 5 dakika çevir.","6 su bardağı sıcak su ekle, sebzeler yumuşayana kadar 20 dakika pişir.","Blenderdan geçir, tuz ve karabiberle tatlandır."]},
  {n:"Türlü", t:60, p:4, k:["patlican:1 adet","kabak:1 adet","patates:2 adet","biber:3 adet","domates:2 adet","sogan:1 adet","salca:1 yemek kaşığı","zeytinyagi:4 yemek kaşığı","tuz:1 tatlı kaşığı","su:1 su bardağı"], s:["Soğanı zeytinyağında kavurup salçayı ekle.","İri doğranmış patates, patlıcan, kabak ve biberi ekle.","Domatesi, tuzu ve 1 su bardağı sıcak suyu ekle.","Kapağı kapalı kısık ateşte sebzeler yumuşayana kadar 40 dakika pişir."]},
  {n:"İmam bayıldı", t:60, p:4, k:["patlican:4 adet","sogan:2 adet","domates:2 adet","sarimsak:4 diş","zeytinyagi:0.5 su bardağı","tuz:1 tatlı kaşığı","su:0.5 su bardağı"], s:["Patlıcanları alacalı soyup zeytinyağında yumuşayana kadar çevir.","Piyazlık soğan ve sarımsağı zeytinyağında kavur, doğranmış domatesi ekle.","Patlıcanları ortadan yarıp harcı doldur.","Yarım su bardağı su ekleyip kısık ateşte 30 dakika pişir; soğuk servis et."]},
  {n:"Ispanak yemeği", t:35, p:4, k:["ispanak:1 kg","sogan:1 adet","pirinc:2 yemek kaşığı","salca:1 yemek kaşığı","yag:3 yemek kaşığı","tuz:1 tatlı kaşığı","su:1 su bardağı"], s:["Soğanı yağda kavurup salçayı ekle.","Yıkanıp doğranmış ıspanağı ekle, sönene kadar karıştır.","Pirinci ve 1 su bardağı sıcak suyu ekle.","Kapağı kapalı kısık ateşte 20 dakika pişir; yoğurtla servis et."]},
  {n:"Mantar çorbası", t:30, p:4, tag:["corba"], k:["mantar:250 g","sogan:1 adet","tereyagi:2 yemek kaşığı","un:2 yemek kaşığı","sut:1 su bardağı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:4 su bardağı"], s:["Soğanı tereyağında kavur, doğranmış mantarları ekleyip suyunu çekene kadar pişir.","Unu ekleyip 1–2 dakika karıştırarak kavur.","4 su bardağı sıcak suyu azar azar, karıştırarak ekle ve 10 dakika kaynat.","Sütü ekle, tuz ve karabiberle tatlandırıp bir taşım daha kaynat."]},
  {n:"Düğün çorbası", t:90, p:4, tag:["corba"], k:["kusbasi:300 g","un:2 yemek kaşığı","yogurt:1 su bardağı","yumurta:1 adet","limon:0.5 adet","tereyagi:1 yemek kaşığı","pul_biber:1 çay kaşığı","tuz:1 tatlı kaşığı","su:6 su bardağı"], s:["Eti 6 su bardağı suda yumuşayana kadar yaklaşık 60 dakika haşla, suyunu ayır ve etini didikle.","Yoğurt, un, yumurta ve limon suyunu bir kapta çırp.","Et suyundan azar azar ekleyerek karışımı ılıştır, sonra tencereye dök ve karıştırarak kaynat.","Didiklenmiş eti ekle, tuzunu ayarla.","Tereyağında pul biberi kızdırıp çorbanın üzerine gezdir."]},
  {n:"Patates çorbası", t:35, p:4, tag:["corba"], k:["patates:3 adet","sogan:1 adet","havuc:1 adet","tereyagi:1 yemek kaşığı","sut:1 su bardağı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:5 su bardağı"], s:["Soğanı tereyağında kavur.","Küp doğranmış patates ve havucu ekleyip 3 dakika çevir.","5 su bardağı sıcak su ekle, sebzeler yumuşayana kadar 20 dakika pişir.","Blenderdan geçir, sütü ekle, tuz ve karabiberle tatlandır."]},
  {n:"Yeşil mercimek çorbası", t:50, p:4, tag:["corba"], k:["yesil_mercimek:1 su bardağı","sogan:1 adet","havuc:1 adet","salca:1 yemek kaşığı","nane:1 tatlı kaşığı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:7 su bardağı"], s:["Yeşil mercimeği 20 dakika haşlayıp süz.","Soğan ve havucu yağda kavurup salçayı ekle.","Mercimeği ve 7 su bardağı sıcak suyu ekleyip 25 dakika pişir.","Nane ve tuzla tatlandırıp servis et."]},
  {n:"Kabak çorbası", t:30, p:4, tag:["corba"], k:["kabak:3 adet","sogan:1 adet","patates:1 adet","tereyagi:1 yemek kaşığı","sut:1 su bardağı","tuz:1 tatlı kaşığı","su:5 su bardağı"], s:["Soğanı tereyağında kavur.","Doğranmış kabak ve patatesi ekleyip 5 dakika çevir.","5 su bardağı sıcak su ekle, 15 dakika pişir.","Blenderdan geçir, sütü ekle ve tuzla tatlandır."]},
  {n:"Hünkar beğendi", t:90, p:4, k:["kusbasi:500 g","sogan:1 adet","domates:2 adet","biber:2 adet","tereyagi:3 yemek kaşığı","patlican:4 adet","un:2 yemek kaşığı","sut:1.5 su bardağı","kasar:50 g","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:2 su bardağı"], s:["Eti 1 kaşık tereyağında suyunu çekene kadar kavur, soğan, biber ve domatesi ekle.","2 su bardağı sıcak su ekleyip et yumuşayana kadar kısık ateşte 50 dakika pişir.","Patlıcanları ocakta ya da fırında közle, kabuklarını soyup bıçakla ez.","Kalan tereyağında unu kavur, sütü azar azar ekleyip çırp; patlıcanı ve rendelenmiş kaşarı ekleyip koyulaşana kadar pişir.","Beğendiyi tabağa yay, üzerine eti koyarak servis et."]},
  {n:"Orman kebabı", t:75, p:4, k:["kusbasi:500 g","patates:2 adet","havuc:1 adet","bezelye:1 su bardağı","sogan:1 adet","salca:1 yemek kaşığı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:3 su bardağı"], s:["Eti yağda suyunu çekene kadar kavur, doğranmış soğanı ekle.","Salçayı ekleyip 1 dakika çevir.","3 su bardağı sıcak su ekle, kısık ateşte 40 dakika pişir.","Küp doğranmış patates, havuç ve bezelyeyi ekleyip sebzeler yumuşayana kadar 20 dakika daha pişir."]},
  {n:"Etli kuru fasulye", t:90, p:4, k:["kusbasi:250 g","kuru_fasulye:2 su bardağı","sogan:1 adet","salca:1 yemek kaşığı","yag:2 yemek kaşığı","pul_biber:1 çay kaşığı","tuz:1 tatlı kaşığı","su:5 su bardağı"], s:["Eti yağda suyunu çekene kadar kavur.","Soğanı ekleyip pembeleşene kadar çevir, salçayı ekle.","Haşlanmış fasulyeyi ve 5 su bardağı sıcak suyu ekle.","Kısık ateşte fasulye ve et iyice yumuşayana kadar 60 dakika pişir, pul biber ve tuzla tatlandır."], note:"Fasulyeyi bir gece önceden ıslatıp haşlaman gerekir."},
  {n:"Tavuk güveç", t:60, p:4, k:["tavuk:500 g","patates:2 adet","biber:2 adet","domates:2 adet","sogan:1 adet","salca:1 yemek kaşığı","zeytinyagi:3 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:1 su bardağı"], s:["Tavuğu ve sebzeleri iri doğrayıp bir fırın kabına koy.","Salçayı zeytinyağı, tuz, karabiber ve 1 su bardağı suyla karıştırıp üzerine dök.","Kabın üzerini folyoyla kapatıp 190 °C fırında 40 dakika pişir.","Folyoyu açıp üzeri kızarana kadar 10 dakika daha pişir."]},
  {n:"Kıymalı makarna", t:30, p:4, k:["makarna:500 g","kiyma:250 g","sogan:1 adet","salca:1 yemek kaşığı","domates:1 adet","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:3 litre"], s:["Makarnayı tuzlu suda 10 dakika haşlayıp süz.","Soğanı ve kıymayı yağda kavur.","Salçayı ve rendelenmiş domatesi ekleyip 5 dakika pişir.","Makarnayı sosla karıştırıp servis et."]},
  {n:"Kıymalı ıspanak", t:40, p:4, k:["ispanak:1 kg","kiyma:200 g","sogan:1 adet","pirinc:2 yemek kaşığı","salca:1 yemek kaşığı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:1 su bardağı"], s:["Soğanı ve kıymayı yağda kavur, salçayı ekle.","Doğranmış ıspanağı ekleyip sönene kadar karıştır.","Pirinci ve 1 su bardağı sıcak suyu ekle.","Kapağı kapalı kısık ateşte 20 dakika pişir; yoğurtla servis et."]},
  {n:"Kıymalı börek", t:60, p:6, k:["yufka:3 adet","kiyma:250 g","sogan:1 adet","yumurta:1 adet","sut:1 su bardağı","yag:0.5 su bardağı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Soğanı ve kıymayı kavurup tuz ve karabiberle tatlandır, soğumaya bırak.","Süt, yumurta ve yağı çırp.","Yufkaları yağlanmış tepsiye katlayarak ser; her katı sütlü karışımla ıslat ve araya kıymalı harcı yay.","En üste kalan sosu sürüp 180 °C fırında üzeri kızarana kadar 35 dakika pişir."]},
  {n:"Tavuklu bezelye", t:45, p:4, k:["tavuk:300 g","bezelye:2 su bardağı","havuc:1 adet","sogan:1 adet","salca:1 yemek kaşığı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:1.5 su bardağı"], s:["Küp doğranmış tavuğu yağda suyunu çekene kadar sotele.","Soğanı ve küp doğranmış havucu ekleyip 5 dakika çevir, salçayı ekle.","Bezelyeyi ve 1,5 su bardağı sıcak suyu ekle.","Kapağı kapalı kısık ateşte bezelye yumuşayana kadar 25 dakika pişir."]},
  {n:"Balık tava", t:25, p:4, k:["balik:750 g","un:1 su bardağı","yag:1.5 su bardağı","tuz:1 tatlı kaşığı","limon:1 adet"], s:["Temizlenmiş balıkları yıkayıp kurula ve tuzla.","Balıkları una bulayıp fazlasını silkele.","Tavada yağı iyice ısıt, balıkları iki yüzü kızarana kadar 3–4 dakika kızart.","Kâğıt havluda yağını alıp limonla servis et."]},
  {n:"Fırında balık", t:40, p:2, k:["balik:2 adet","patates:2 adet","domates:1 adet","biber:2 adet","limon:1 adet","zeytinyagi:4 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Patatesleri ince dilimleyip fırın kabına diz.","Balıkları üzerine koy, aralarına domates, biber ve limon dilimleri yerleştir.","Zeytinyağı, tuz ve karabiber gezdir.","200 °C fırında balık pişip patatesler yumuşayana kadar 30 dakika pişir."]},
  {n:"Patlıcan kebabı", t:60, p:4, k:["patlican:3 adet","kiyma:400 g","sogan:1 adet","domates:2 adet","biber:3 adet","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:0.5 su bardağı"], s:["Kıymayı rendelenmiş soğan, tuz ve karabiberle yoğurup küçük köfteler yap.","Patlıcanları kalın halka doğra.","Fırın kabına patlıcan ve köfteleri sırayla diz, aralarına domates ve biber yerleştir.","Yarım su bardağı su ekleyip 190 °C fırında 40 dakika pişir."]},
  {n:"Zeytinyağlı pırasa", t:45, p:4, k:["pirasa:1 kg","havuc:1 adet","pirinc:2 yemek kaşığı","limon:0.5 adet","zeytinyagi:0.5 su bardağı","seker:1 çay kaşığı","tuz:1 tatlı kaşığı","su:1 su bardağı"], s:["Pırasaları yıkayıp 2 cm’lik parçalar hâlinde doğra.","Zeytinyağında halka doğranmış havucu 3 dakika kavur, pırasayı ekle.","Pirinç, şeker, tuz ve 1 su bardağı sıcak su ekle.","Kısık ateşte 30 dakika pişir, limon suyunu ekleyip soğuk servis et."]},
  {n:"Kapuska", t:45, p:4, k:["lahana:1 kg","sogan:1 adet","salca:1 yemek kaşığı","pirinc:2 yemek kaşığı","yag:3 yemek kaşığı","pul_biber:1 çay kaşığı","tuz:1 tatlı kaşığı","su:1 su bardağı"], s:["Lahanayı ince şeritler hâlinde doğra.","Soğanı yağda kavurup salçayı ekle.","Lahanayı ekleyip sönene kadar karıştır.","Pirinç, pul biber, tuz ve 1 su bardağı sıcak su ekleyip kapağı kapalı 30 dakika pişir."]},
  {n:"Mantar sote", t:20, p:4, k:["mantar:500 g","sogan:1 adet","biber:2 adet","tereyagi:2 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Mantarları dilimle.","Tereyağında soğan ve biberi 3 dakika kavur.","Mantarları ekleyip yüksek ateşte suyunu salıp çekene kadar sotele.","Tuz ve karabiberle tatlandırıp servis et."]},
  {n:"Bezelye yemeği", t:40, p:4, k:["bezelye:3 su bardağı","havuc:1 adet","patates:1 adet","sogan:1 adet","salca:1 yemek kaşığı","yag:3 yemek kaşığı","tuz:1 tatlı kaşığı","su:1.5 su bardağı"], s:["Soğanı yağda kavurup salçayı ekle.","Küp doğranmış havuç ve patatesi ekleyip 3 dakika çevir.","Bezelyeyi, tuzu ve 1,5 su bardağı sıcak suyu ekle.","Kapağı kapalı kısık ateşte 25 dakika pişir."]},
  {n:"Mercimek köftesi", t:50, p:6, k:["mercimek:1 su bardağı","bulgur:1.5 su bardağı","sogan:1 adet","salca:1 yemek kaşığı","maydanoz:1 demet","limon:1 adet","pul_biber:1 tatlı kaşığı","zeytinyagi:0.5 su bardağı","tuz:1 tatlı kaşığı","su:2.5 su bardağı"], s:["Mercimeği 2,5 su bardağı suda dağılana kadar 15 dakika haşla; ocağı kapatıp bulguru ekle, kapağını kapatıp 20 dakika beklet.","Soğanı zeytinyağında kavurup salçayı ekle.","Bulgurlu karışıma kavrulmuş soğanı, pul biberi, tuzu ve limon suyunu ekleyip iyice yoğur.","İnce kıyılmış maydanozu ekle, avucunla sıkarak köfte şekli ver."]},
  {n:"Fırında sebze", t:50, p:4, k:["patates:2 adet","kabak:1 adet","havuc:2 adet","biber:2 adet","sogan:1 adet","zeytinyagi:4 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Tüm sebzeleri iri doğrayıp fırın kabına koy.","Zeytinyağı, tuz ve karabiberle karıştır.","200 °C fırında ara sıra karıştırarak sebzeler yumuşayıp kızarana kadar 40 dakika pişir."]},
  {n:"Acılı ezme", t:15, p:4, k:["domates:2 adet","biber:2 adet","sogan:1 adet","maydanoz:0.5 demet","salca:1 yemek kaşığı","limon:0.5 adet","zeytinyagi:3 yemek kaşığı","pul_biber:1 tatlı kaşığı","tuz:1 çay kaşığı"], s:["Domates, biber, soğan ve maydanozu bıçakla çok ince doğra.","Salça, pul biber, tuz, limon suyu ve zeytinyağını ekle.","İyice karıştırıp 10 dakika dinlendir."]},
  {n:"Piyaz", t:15, p:4, k:["kuru_fasulye:2 su bardağı","sogan:1 adet","maydanoz:0.5 demet","domates:1 adet","limon:1 adet","zeytinyagi:4 yemek kaşığı","pul_biber:1 çay kaşığı","tuz:1 çay kaşığı"], s:["Soğanı piyazlık doğrayıp tuzla ovarak yıka ve süz.","Haşlanmış fasulye, soğan, doğranmış domates ve maydanozu bir kaba al.","Zeytinyağı, limon suyu, tuz ve pul biberi ekleyip karıştır."], note:"Fasulye haşlanmış olmalı; kuru fasulyeyi bir gece ıslatıp haşlaman gerekir."},
  {n:"Haydari", t:10, p:4, k:["yogurt:2 su bardağı","peynir:50 g","sarimsak:1 diş","nane:1 tatlı kaşığı","zeytinyagi:2 yemek kaşığı","tuz:1 çay kaşığı"], s:["Yoğurdu ezilmiş sarımsak, ufalanmış peynir, nane ve tuzla karıştır.","Üzerine zeytinyağı gezdirip soğuk servis et."], note:"Süzme yoğurtla daha koyu ve lezzetli olur."},
  {n:"Patates kızartması", t:25, p:4, k:["patates:4 adet","yag:2 su bardağı","tuz:1 tatlı kaşığı"], s:["Patatesleri soyup parmak doğra, soğuk suda 10 dakika beklet ve kurula.","Yağı derin bir tavada iyice ısıt.","Patatesleri parti parti, altın rengi olana kadar 6–8 dakika kızart.","Kâğıt havluya alıp tuzla."]},
  {n:"Fırında makarna", t:45, p:6, k:["makarna:500 g","sut:2 su bardağı","yumurta:2 adet","kasar:100 g","tereyagi:1 yemek kaşığı","tuz:1 tatlı kaşığı","su:3 litre"], s:["Makarnayı tuzlu suda 8 dakika haşlayıp süz.","Süt, yumurta ve tuzu çırp.","Makarnayı tereyağıyla yağlanmış fırın kabına yay, sütlü karışımı dök ve üzerine rendelenmiş kaşar serp.","180 °C fırında üzeri kızarana kadar 25 dakika pişir."]},
  {n:"Nohutlu pilav", t:35, p:4, k:["pirinc:2 su bardağı","nohut:1 su bardağı","tereyagi:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:3 su bardağı"], s:["Pirinci ılık suda bekletip süz.","Tereyağında pirinci şeffaflaşana kadar kavur, haşlanmış nohutu ekle.","3 su bardağı sıcak su ve tuz ekle, suyunu çekene kadar kısık ateşte pişir.","Ocaktan alıp 10 dakika demlenmeye bırak."]},
  {n:"Şehriyeli pilav", t:30, p:4, k:["pirinc:2 su bardağı","sehriye:0.5 su bardağı","tereyagi:2 yemek kaşığı","tuz:1 tatlı kaşığı","su:3 su bardağı"], s:["Pirinci ılık suda bekletip süz.","Tereyağında şehriyeyi kızarana kadar kavur, pirinci ekleyip 2 dakika daha çevir.","3 su bardağı sıcak su ve tuz ekle, suyunu çekene kadar kısık ateşte pişir.","10 dakika demlendirip servis et."]},
  {n:"Pişi", t:60, p:6, tag:["kahvalti"], k:["un:3 su bardağı","maya:1 paket","sut:1 su bardağı","su:1 su bardağı","seker:1 tatlı kaşığı","tuz:1 tatlı kaşığı","yag:2 su bardağı"], s:["Ilık süt, ılık su, maya ve şekeri karıştır.","Un ve tuzu ekleyip yumuşak bir hamur yoğur, üzerini örtüp 40 dakika mayalandır.","Hamurdan parçalar kopar, elinle yassılaştır.","Kızgın yağda iki yüzünü kızart."]},
  {n:"Çılbır", t:15, p:2, tag:["kahvalti"], k:["yumurta:4 adet","yogurt:1.5 su bardağı","sarimsak:1 diş","tereyagi:2 yemek kaşığı","pul_biber:1 tatlı kaşığı","tuz:1 çay kaşığı","su:1 litre"], s:["Yoğurdu ezilmiş sarımsak ve tuzla karıştırıp tabaklara yay.","Suyu kaynat, ocağı kısıp yumurtaları tek tek kırarak 3 dakika pişir.","Yumurtaları kevgirle alıp yoğurdun üzerine koy.","Tereyağında pul biberi kızdırıp üzerine gezdir."]},
  {n:"Sahanda yumurta", t:5, p:1, tag:["kahvalti"], k:["yumurta:2 adet","tereyagi:1 yemek kaşığı","tuz:1 tutam"], s:["Sahanda tereyağını erit.","Yumurtaları sarıları dağılmadan kır.","Beyazları pişene kadar 3 dakika pişir, tuz serpip servis et."]},
  {n:"Peynirli gözleme", t:25, p:2, tag:["kahvalti"], k:["yufka:2 adet","peynir:150 g","maydanoz:0.5 demet","tereyagi:2 yemek kaşığı"], s:["Peyniri ufalayıp kıyılmış maydanozla karıştır.","Yufkayı ikiye katla, bir yarısına harcı yay ve kenarlarını içe katlayarak kapat.","Tavada tereyağını erit, gözlemeyi iki yüzü kızarana kadar pişir."]},
  {n:"Patatesli yumurta", t:20, p:2, tag:["kahvalti"], k:["patates:2 adet","yumurta:3 adet","yag:3 yemek kaşığı","tuz:1 çay kaşığı","karabiber:1 çay kaşığı"], s:["Patatesleri küp doğra, yağda yumuşayıp kızarana kadar 10 dakika kavur.","Yumurtaları üzerine kır.","Kapağı kapalı yumurtalar pişene kadar 3 dakika beklet, tuz ve karabiberle servis et."]},
  {n:"Mantarlı omlet", t:15, p:1, tag:["kahvalti"], k:["yumurta:3 adet","mantar:100 g","tereyagi:1 yemek kaşığı","tuz:1 tutam","karabiber:1 tutam"], s:["Mantarları dilimleyip tereyağında suyunu çekene kadar sotele.","Yumurtaları tuz ve karabiberle çırpıp mantarların üzerine dök.","Kısık ateşte pişir, ikiye katlayıp servis et."]},
  {n:"Revani", t:60, p:8, tag:["tatli"], k:["irmik:1 su bardağı","un:1 su bardağı","seker:3 su bardağı","yumurta:4 adet","yogurt:1 su bardağı","kabartma_tozu:1 paket","limon:0.5 adet","su:3 su bardağı"], s:["Şerbet için 2 su bardağı şekeri 3 su bardağı suyla 10 dakika kaynat, limon suyunu ekleyip soğumaya bırak.","Yumurtaları kalan 1 su bardağı şekerle köpürene kadar çırp.","Yoğurt, irmik, un ve kabartma tozunu ekleyip karıştır.","Yağlanmış tepsiye dök, 180 °C fırında 30 dakika pişir.","Sıcak revaniye soğuk şerbeti dök ve şerbeti çekene kadar beklet."]},
  {n:"Kek", t:50, p:8, tag:["tatli"], k:["un:2.5 su bardağı","seker:1 su bardağı","yumurta:3 adet","sut:1 su bardağı","yag:1 su bardağı","kabartma_tozu:1 paket"], s:["Yumurta ve şekeri köpürene kadar çırp.","Süt ve yağı ekleyip karıştır.","Un ve kabartma tozunu eleyerek ekle, pürüzsüz olana kadar karıştır.","Yağlanmış kalıba dök, 175 °C fırında 40 dakika pişir; kürdan kuru çıkıyorsa olmuştur."]},
  {n:"Un helvası", t:30, p:6, tag:["tatli"], k:["un:1.5 su bardağı","tereyagi:125 g","seker:1 su bardağı","sut:1 su bardağı","su:1 su bardağı","ceviz:0.5 su bardağı"], s:["Süt, su ve şekeri şeker eriyene kadar ısıt.","Tereyağını erit, unu ekleyip kısık ateşte rengi kahverengileşene kadar 15 dakika kavur.","Sıcak şerbeti dikkatlice ekle, suyunu çekene kadar karıştır.","Kapağını kapatıp 10 dakika demlendir, cevizle servis et."], note:"Şerbeti eklerken buhar çıkar, yüzünü tencereden uzak tut."},
  {n:"Şekerpare", t:60, p:8, tag:["tatli"], k:["un:2 su bardağı","irmik:2 yemek kaşığı","tereyagi:125 g","yumurta:1 adet","seker:2.5 su bardağı","kabartma_tozu:1 paket","limon:0.5 adet","su:2.5 su bardağı"], s:["Şerbet için 2 su bardağı şekeri 2,5 su bardağı suyla 10 dakika kaynat, limon suyunu ekleyip soğut.","Tereyağı, yumurta ve yarım su bardağı şekeri karıştır.","Un, irmik ve kabartma tozunu ekleyip ele yapışmayan bir hamur yoğur.","Ceviz büyüklüğünde parçalar yuvarlayıp tepsiye diz, 180 °C fırında 25 dakika pişir.","Sıcak tatlıya soğuk şerbeti dök, 1 saat beklet."]},
  {n:"Türk kahvesi", t:5, p:1, tag:["kahve"], k:["turk_kahvesi:1 tatlı kaşığı","su:1 fincan"], s:["Cezveye 1 fincan soğuk su ve kahveyi koy; şekerli istersen şekeri de şimdi ekle.","Karıştırıp kısık ateşe al ve bir daha karıştırma.","Köpük yükselmeye başlayınca köpüğü fincana paylaştır.","Cezveyi kısa bir süre daha ısıtıp kalan kahveyi fincana yavaşça dök."], note:"Yanında bir bardak su ve lokumla servis edilir."},
  {n:"Sütlü Türk kahvesi", t:5, p:1, tag:["kahve"], k:["turk_kahvesi:1 tatlı kaşığı","sut:1 fincan"], s:["Cezveye 1 fincan soğuk süt ve kahveyi koyup karıştır.","Kısık ateşte, taşmamasına dikkat ederek ısıt.","Köpük yükselince ocaktan al ve fincana dök."]},
  {n:"Espresso", m:"İtalyan mutfağı", t:3, p:1, tag:["kahve"], k:["espresso:1 shot"], s:["Makinenin haznesine bir shot için yaklaşık 18 g ince öğütülmüş kahve koy ve düz bir yüzey olacak şekilde bastır.","Hazneyi makineye tak, fincanı altına yerleştir.","Yaklaşık 25–30 saniyede 40 ml kahve akacak şekilde demle."], note:"Espresso makinesi gerekir; moka potla da benzer yoğun bir kahve yapabilirsin."},
  {n:"Americano", m:"Amerikan mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:1 shot","su:150 ml"], s:["Bir espresso hazırla.","Fincana 150 ml sıcak su koy.","Espressoyu sıcak suyun üzerine dök."]},
  {n:"Latte", m:"İtalyan mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:1 shot","sut:200 ml"], s:["Bir espresso hazırlayıp büyük bir fincana al.","Sütü 60–65 °C’ye kadar ısıt, köpürtücün varsa ince bir köpük oluştur.","Sıcak sütü espressonun üzerine yavaşça dök; üstte ince bir köpük katmanı kalsın."]},
  {n:"Cappuccino", m:"İtalyan mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:1 shot","sut:120 ml"], s:["Bir espresso hazırla.","Sütü ısıtıp bol ve yoğun bir köpük olana kadar köpürt.","Fincanı üçte bir espresso, üçte bir süt, üçte bir köpük olacak şekilde doldur.","İstersen üzerine biraz tarçın ya da kakao serp."]},
  {n:"Flat white", m:"Avustralya mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:2 shot","sut:120 ml"], s:["Çift shot espresso hazırla.","Sütü ince, ipeksi bir köpükle ısıt.","Sütü espressonun üzerine dök; köpük katmanı çok ince olmalı."]},
  {n:"Macchiato", m:"İtalyan mutfağı", t:4, p:1, tag:["kahve"], k:["espresso:1 shot","sut:30 ml"], s:["Bir espresso hazırla.","Sütü köpürt.","Espressonun üzerine bir iki kaşık süt köpüğü koy."]},
  {n:"Mocha", m:"İtalyan mutfağı", t:6, p:1, tag:["kahve"], k:["espresso:1 shot","sut:200 ml","cikolata:20 g"], s:["Sütü ısıtıp içinde çikolatayı erit.","Bir espresso hazırlayıp büyük bir fincana al.","Çikolatalı sütü espressonun üzerine dök."]},
  {n:"Filtre kahve", m:"Dünya mutfağı", t:6, p:1, tag:["kahve"], k:["filtre_kahve:2 yemek kaşığı","su:250 ml"], s:["Filtre kâğıdını demliğe yerleştirip sıcak suyla ıslat, suyu dök.","Orta öğütülmüş kahveyi filtreye koy.","Kaynayıp 30 saniye dinlenmiş suyu önce kahveyi ıslatacak kadar dök ve 30 saniye beklet.","Kalan suyu yavaşça, dairesel hareketlerle dök ve süzülmesini bekle."]},
  {n:"French press kahve", m:"Fransız mutfağı", t:6, p:1, tag:["kahve"], k:["filtre_kahve:3 yemek kaşığı","su:300 ml"], s:["İri öğütülmüş kahveyi French press’e koy.","Kaynayıp biraz dinlenmiş suyu ekle ve karıştır.","Kapağı kapatıp 4 dakika demlenmeye bırak.","Pistonu yavaşça bastır ve kahveyi fincana dök."]},
  {n:"Soğuk latte", o:"Iced Latte", m:"Dünya mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:1 shot","sut:200 ml","buz:1 su bardağı"], s:["Bardağı buzla doldur.","Soğuk sütü buzların üzerine dök.","Espresso hazırlayıp sütün üzerine yavaşça ekle."]},
  {n:"Cold brew", m:"Dünya mutfağı", t:10, p:2, tag:["kahve"], k:["filtre_kahve:50 g","su:500 ml","buz:1 su bardağı"], s:["İri öğütülmüş kahveyi bir kavanozda soğuk suyla karıştır.","Kapağı kapalı buzdolabında 12 saat demlendir.","Kahveyi filtre kâğıdından süz.","Buzlu bardağa koyup istersen sütle servis et."], note:"Süzülmüş cold brew buzdolabında 1 hafta saklanabilir."},
  {n:"Dalgona kahve", m:"Kore mutfağı", t:10, p:1, tag:["kahve"], k:["granul_kahve:2 yemek kaşığı","seker:2 yemek kaşığı","su:2 yemek kaşığı","sut:1 su bardağı","buz:0.5 su bardağı"], s:["Granül kahve, şeker ve sıcak suyu bir kaba koy.","Mikserle 3–5 dakika açık kahverengi, koyu bir köpük olana kadar çırp.","Bardağa buz ve soğuk süt koy.","Kahve köpüğünü kaşıkla sütün üzerine yerleştir."]},
  {n:"Frappe", m:"Yunan mutfağı", t:5, p:1, tag:["kahve"], k:["granul_kahve:2 tatlı kaşığı","seker:1 tatlı kaşığı","sut:1 su bardağı","buz:1 su bardağı"], s:["Tüm malzemeleri blendera koy.","Köpüklü ve pürüzsüz olana kadar 1 dakika çek.","Uzun bir bardağa dökerek servis et."]},
  {n:"Affogato", m:"İtalyan mutfağı", t:5, p:1, tag:["kahve"], k:["espresso:1 shot","dondurma:1 top"], s:["Bir kâse ya da bardağa bir top vanilyalı dondurma koy.","Sıcak bir espresso hazırla.","Espressoyu dondurmanın üzerine dök ve hemen servis et."]},

  {n:"Humus", m:"Orta Doğu mutfağı", t:20, p:4, tag:["meze"], k:["nohut:2 su bardağı","tahin:3 yemek kaşığı","limon:1 adet","sarimsak:1 diş","zeytinyagi:3 yemek kaşığı","tuz:1 çay kaşığı","su:3 yemek kaşığı"], s:["Haşlanmış nohutu, tahini, limon suyunu, sarımsağı ve tuzu blendera koy.","Birkaç kaşık su ekleyerek pürüzsüz olana kadar çek.","Tabağa yay, üzerine zeytinyağı gezdir."], note:"Kuru nohutu bir gece ıslatıp yumuşayana kadar haşlaman gerekir."},
  {n:"Babagannuş", m:"Orta Doğu mutfağı", t:40, p:4, tag:["meze"], k:["patlican:3 adet","tahin:2 yemek kaşığı","sarimsak:1 diş","limon:0.5 adet","zeytinyagi:2 yemek kaşığı","tuz:1 çay kaşığı"], s:["Patlıcanları közle, kabuklarını soy.","Bıçakla ince ince doğra.","Tahin, ezilmiş sarımsak, limon suyu ve tuzla karıştır.","Üzerine zeytinyağı gezdirerek servis et."]},
  {n:"Şakşuka", t:40, p:4, tag:["meze"], k:["patlican:2 adet","kabak:1 adet","biber:2 adet","domates:2 adet","sarimsak:2 diş","salca:1 yemek kaşığı","yag:1 su bardağı","tuz:1 tatlı kaşığı"], s:["Patlıcan ve kabağı küp doğrayıp kızgın yağda kızart, kâğıt havluya al.","Biberleri de kızart.","Sarımsak, rendelenmiş domates ve salçayla 10 dakika sos pişir.","Kızarmış sebzeleri sosla karıştırıp soğuk servis et."]},
  {n:"Atom", t:10, p:4, tag:["meze"], k:["yogurt:2 su bardağı","pul_biber:1 yemek kaşığı","tereyagi:2 yemek kaşığı","sarimsak:1 diş","tuz:1 çay kaşığı"], s:["Yoğurdu ezilmiş sarımsak ve tuzla karıştırıp tabağa yay.","Tereyağını erit, pul biberi ekleyip 30 saniye kızdır.","Biberli yağı yoğurdun ortasına dök."], note:"Süzme yoğurt ve kuru acı biberle daha geleneksel olur."},
  {n:"Fava", t:45, p:6, tag:["meze"], k:["fava:1 su bardağı","sogan:1 adet","zeytinyagi:0.5 su bardağı","seker:1 tatlı kaşığı","tuz:1 tatlı kaşığı","dereotu:0.5 demet","su:3 su bardağı"], s:["Kuru baklayı yıka, doğranmış soğanla birlikte zeytinyağında 2 dakika çevir.","3 su bardağı sıcak su ekleyip bakla dağılana kadar 30 dakika pişir.","Şeker ve tuzu ekleyip blenderdan geçir.","Bir kaba dök, soğuyunca dilimleyip dereotuyla servis et."]},
  {n:"Patlıcan salatası", t:40, p:4, tag:["meze"], k:["patlican:3 adet","domates:1 adet","biber:1 adet","sarimsak:1 diş","maydanoz:0.5 demet","limon:0.5 adet","zeytinyagi:3 yemek kaşığı","tuz:1 çay kaşığı"], s:["Patlıcanları közleyip soy, iri doğra.","Doğranmış domates, biber, maydanoz ve ezilmiş sarımsakla karıştır.","Limon suyu, zeytinyağı ve tuzla tatlandır."]},
  {n:"Muhammara", m:"Orta Doğu mutfağı", t:25, p:6, tag:["meze"], k:["kapya:3 adet","ceviz:1 su bardağı","ekmek:2 dilim","sarimsak:1 diş","salca:1 yemek kaşığı","nar_eksisi:1 yemek kaşığı","pul_biber:1 tatlı kaşığı","zeytinyagi:4 yemek kaşığı","tuz:1 çay kaşığı"], s:["Kapya biberleri közle ya da fırında yumuşat, kabuklarını soy.","Biber, ceviz, bayat ekmek, sarımsak ve salçayı rondoda çek.","Nar ekşisi, pul biber, tuz ve zeytinyağını ekleyip karıştır."]},
  {n:"Rus salatası", t:40, p:6, tag:["meze"], k:["patates:3 adet","havuc:2 adet","bezelye:1 su bardağı","tursu:4 adet","mayonez:4 yemek kaşığı","yogurt:3 yemek kaşığı","tuz:1 çay kaşığı"], s:["Patates ve havucu küp doğrayıp haşla, bezelyeyi 5 dakika haşla ve hepsini soğut.","Turşuları küçük doğra.","Tüm malzemeleri mayonez, yoğurt ve tuzla karıştır."]},
  {n:"Köpoğlu", t:40, p:4, tag:["meze"], k:["patlican:2 adet","biber:2 adet","domates:1 adet","yogurt:1.5 su bardağı","sarimsak:2 diş","yag:1 su bardağı","tuz:1 çay kaşığı"], s:["Patlıcanları küp doğrayıp kızart, biberleri de kızart.","Domatesi rendeleyip birkaç dakika sos pişir.","Yoğurdu ezilmiş sarımsak ve tuzla karıştır.","Kızarmış sebzelerin üzerine önce domates sosunu, sonra yoğurdu koy."]},
  {n:"Girit ezmesi", t:10, p:4, tag:["meze"], k:["peynir:200 g","ceviz:0.5 su bardağı","dereotu:0.5 demet","sarimsak:1 diş","zeytinyagi:4 yemek kaşığı"], s:["Peyniri çatalla ez.","Dövülmüş ceviz, ince kıyılmış dereotu ve ezilmiş sarımsağı ekle.","Zeytinyağıyla karıştırıp kremamsı bir kıvam elde et."]},
  {n:"Zeytinyağlı yaprak sarma", t:90, p:6, tag:["meze"], k:["asma_yapragi:250 g","pirinc:1 su bardağı","sogan:2 adet","nane:1 tatlı kaşığı","zeytinyagi:0.5 su bardağı","limon:1 adet","seker:1 tatlı kaşığı","tuz:1 tatlı kaşığı","su:2 su bardağı"], s:["Soğanı zeytinyağında kavur, yıkanmış pirinci ekleyip 3 dakika çevir.","Nane, tuz, şeker ve yarım su bardağı su ekleyip pirinç suyunu çekene kadar pişir, soğut.","Yaprakları damarlı yüzü üste gelecek şekilde ser, ucuna biraz iç koyup kenarlarını katla ve sıkıca sar.","Sarmaları tencereye diz; limon suyu, kalan zeytinyağı ve 1,5 su bardağı sıcak su ekle.","Üzerine ters bir tabak kapatıp kısık ateşte 40 dakika pişir, soğuk servis et."]},

  {n:"Spagetti bolonez", o:"Spaghetti Bolognese", m:"İtalyan mutfağı", t:45, p:4, tag:["dunya"], k:["makarna:500 g","kiyma:300 g","sogan:1 adet","havuc:1 adet","sarimsak:2 diş","domates:4 adet","salca:1 yemek kaşığı","zeytinyagi:3 yemek kaşığı","kasar:50 g","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:3 litre"], s:["Soğan, havuç ve sarımsağı küçük doğrayıp zeytinyağında 5 dakika kavur.","Kıymayı ekleyip suyunu çekene kadar pişir.","Rendelenmiş domates ve salçayı ekle, kısık ateşte 25 dakika pişir.","Makarnayı tuzlu suda haşla, sosla karıştırıp rendelenmiş peynirle servis et."]},
  {n:"Karbonara", o:"Spaghetti Carbonara", m:"İtalyan mutfağı", t:25, p:4, tag:["dunya"], k:["makarna:400 g","pastirma:100 g","yumurta:3 adet","kasar:80 g","karabiber:1 tatlı kaşığı","tuz:1 tatlı kaşığı","su:3 litre"], s:["Makarnayı tuzlu suda haşla, süzmeden önce 1 kepçe suyunu ayır.","Pastırmayı küçük doğrayıp tavada çıtırlaşana kadar çevir.","Yumurtaları rendelenmiş peynir ve bol karabiberle çırp.","Ocağı kapat; makarnayı pastırmalı tavaya al, yumurtalı karışımı ve biraz makarna suyunu ekleyip hızla karıştır."], note:"Orijinalinde domuz yanağı kullanılır; burada dana pastırma kullanıldı. Ocak açık kalırsa yumurta topaklanır."},
  {n:"Pizza margherita", o:"Pizza Margherita", m:"İtalyan mutfağı", t:90, p:4, tag:["dunya"], k:["un:3 su bardağı","maya:1 paket","su:1 su bardağı","zeytinyagi:2 yemek kaşığı","seker:1 çay kaşığı","tuz:1 tatlı kaşığı","domates:3 adet","sarimsak:1 diş","mozzarella:200 g"], s:["Ilık su, maya ve şekeri karıştır; un, tuz ve zeytinyağını ekleyip yumuşak bir hamur yoğur.","Üzerini örtüp 1 saat mayalandır.","Domatesleri rendeleyip sarımsak ve tuzla 10 dakika koyulaşana kadar pişir.","Hamuru açıp tepsiye yerleştir, sosu sür ve mozzarellayı dağıt.","250 °C fırında kenarları kızarana kadar 12–15 dakika pişir."], note:"Üzerine taze fesleğen yaprakları koyarsan tam Napoli usulü olur."},
  {n:"Mantarlı risotto", o:"Risotto ai Funghi", m:"İtalyan mutfağı", t:40, p:4, tag:["dunya"], k:["pirinc:1.5 su bardağı","mantar:250 g","sogan:1 adet","tereyagi:2 yemek kaşığı","kasar:50 g","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı","su:5 su bardağı"], s:["Soğanı tereyağında kavur, dilimlenmiş mantarları ekleyip suyunu çekene kadar pişir.","Pirinci ekleyip 2 dakika çevir.","Sıcak suyu kepçe kepçe ekle; pirinç her kepçeyi çekince yenisini ekleyip sürekli karıştır, yaklaşık 20 dakika.","Ocaktan alıp rendelenmiş peynir, tuz ve karabiberle karıştır."], note:"Arborio gibi risottoluk pirinçle daha kremamsı olur."},
  {n:"Lazanya", o:"Lasagna", m:"İtalyan mutfağı", t:90, p:6, tag:["dunya"], k:["lazanya:250 g","kiyma:400 g","sogan:1 adet","domates:4 adet","salca:1 yemek kaşığı","un:3 yemek kaşığı","tereyagi:3 yemek kaşığı","sut:3 su bardağı","kasar:150 g","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Soğanı ve kıymayı kavur, rendelenmiş domates ve salçayı ekleyip 20 dakika sos pişir.","Beşamel için tereyağında unu kavur, sütü azar azar ekleyip koyulaşana kadar çırp.","Fırın kabına sırayla lazanya yaprağı, kıymalı sos ve beşamel diz; bunu 3 kat tekrarla.","En üste beşamel ve rendelenmiş kaşar koy.","180 °C fırında 40 dakika pişir."]},
  {n:"Spagetti aglio olio", o:"Spaghetti Aglio e Olio", m:"İtalyan mutfağı", t:20, p:4, tag:["dunya"], k:["makarna:400 g","sarimsak:5 diş","zeytinyagi:0.5 su bardağı","pul_biber:1 tatlı kaşığı","maydanoz:0.5 demet","tuz:1 tatlı kaşığı","su:3 litre"], s:["Makarnayı tuzlu suda haşla, 1 kepçe suyunu ayır.","İnce dilimlenmiş sarımsağı zeytinyağında kısık ateşte altın rengi olana kadar pişir, pul biberi ekle.","Makarnayı ve biraz makarna suyunu tavaya ekleyip karıştır.","Kıyılmış maydanozla servis et."]},
  {n:"Hamburger", m:"Amerikan mutfağı", t:30, p:4, tag:["dunya"], k:["kiyma:500 g","hamburger_ekmegi:4 adet","kasar:4 dilim","domates:1 adet","sogan:1 adet","tursu:2 adet","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Kıymayı tuz ve karabiberle yoğurup 4 eşit köfte yap, ortalarını hafifçe bastır.","Köfteleri ızgarada ya da tavada her yüzünü 4 dakika pişir, son dakikada üzerlerine kaşar koy.","Ekmekleri tavada hafifçe ısıt.","Ekmeklere köfte, domates, soğan ve turşu dilimlerini yerleştir."]},
  {n:"Sezar salata", o:"Caesar Salad", m:"Amerikan mutfağı", t:25, p:4, tag:["dunya"], k:["marul:1 adet","tavuk:300 g","ekmek:2 dilim","kasar:40 g","mayonez:3 yemek kaşığı","limon:0.5 adet","sarimsak:1 diş","zeytinyagi:3 yemek kaşığı","tuz:1 çay kaşığı"], s:["Tavuğu tuz ve zeytinyağıyla ızgarada pişirip dilimle.","Ekmekleri küp doğrayıp tavada kızart.","Mayonez, limon suyu, ezilmiş sarımsak ve rendelenmiş peyniri karıştırıp sos yap.","Doğranmış marulu sosla karıştır, üzerine tavuk ve kıtır ekmekleri koy."]},
  {n:"Tacos", m:"Meksika mutfağı", t:30, p:4, tag:["dunya"], k:["lavas:8 adet","kiyma:400 g","sogan:1 adet","domates:2 adet","biber:2 adet","kasar:100 g","pul_biber:1 tatlı kaşığı","yag:1 yemek kaşığı","tuz:1 tatlı kaşığı"], s:["Soğanı yağda kavurup kıymayı ekle, pul biber ve tuzla pişir.","Domates ve biberi küçük doğra.","Lavaşları tavada ısıt.","İçlerine kıyma, sebze ve rendelenmiş kaşar koyup katlayarak servis et."]},
  {n:"Tavuk fajita", o:"Chicken Fajitas", m:"Meksika mutfağı", t:30, p:4, tag:["dunya"], k:["tavuk:500 g","kapya:2 adet","biber:2 adet","sogan:1 adet","lavas:4 adet","zeytinyagi:2 yemek kaşığı","pul_biber:1 tatlı kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Tavuğu ve sebzeleri ince şeritler hâlinde doğra.","Tavuğu yüksek ateşte zeytinyağında sotele.","Sebzeleri ve baharatları ekleyip 5 dakika daha çevir.","Isıtılmış lavaşlara sararak servis et."]},
  {n:"Guacamole", m:"Meksika mutfağı", t:10, p:4, tag:["dunya"], k:["avokado:2 adet","domates:1 adet","sogan:0.5 adet","limon:1 adet","sarimsak:1 diş","pul_biber:1 çay kaşığı","tuz:1 çay kaşığı"], s:["Avokadoları ikiye kesip çekirdeğini çıkar, içini çatalla ez.","İnce doğranmış domates, soğan ve ezilmiş sarımsağı ekle.","Limon suyu, tuz ve pul biberle karıştırıp hemen servis et."], note:"Limon suyu avokadonun kararmasını geciktirir."},
  {n:"Pad Thai", m:"Tayland mutfağı", t:30, p:2, tag:["dunya"], k:["pirinc_eriste:200 g","tavuk:200 g","yumurta:2 adet","fistik:3 yemek kaşığı","soya_sosu:3 yemek kaşığı","seker:1 yemek kaşığı","limon:1 adet","sarimsak:2 diş","yag:2 yemek kaşığı"], s:["Pirinç eriştesini sıcak suda 10 dakika ıslatıp süz.","Tavuğu sarımsakla yağda sotele, yumurtaları kırıp karıştırarak pişir.","Erişteyi, soya sosunu, şekeri ve limon suyunu ekleyip 3 dakika karıştır.","Dövülmüş fıstık serperek servis et."]},
  {n:"Tavuk köri", o:"Chicken Curry", m:"Hint mutfağı", t:40, p:4, tag:["dunya"], k:["tavuk:500 g","sogan:1 adet","sarimsak:2 diş","kori:1 yemek kaşığı","domates:2 adet","krema:1 su bardağı","yag:2 yemek kaşığı","tuz:1 tatlı kaşığı"], s:["Soğan ve sarımsağı yağda kavur, köri baharatını ekleyip 1 dakika çevir.","Küp doğranmış tavuğu ekleyip rengi dönene kadar pişir.","Rendelenmiş domatesi ekleyip 10 dakika pişir.","Kremayı ekleyip kısık ateşte 10 dakika daha pişir, pilavla servis et."], note:"Krema yerine hindistan cevizi sütü kullanırsan daha geleneksel olur."},
  {n:"Kızarmış pilav", o:"Fried Rice", m:"Çin mutfağı", t:25, p:4, tag:["dunya"], k:["pirinc:1.5 su bardağı","yumurta:2 adet","havuc:1 adet","bezelye:0.5 su bardağı","sogan:1 adet","soya_sosu:3 yemek kaşığı","yag:2 yemek kaşığı"], s:["Pirinci önceden haşlayıp soğut; bir gün önce pişmiş pirinç en iyisidir.","Doğranmış soğan, havuç ve bezelyeyi yağda yüksek ateşte 3 dakika sotele.","Yumurtaları kırıp karıştırarak pişir.","Pirinci ve soya sosunu ekleyip 3 dakika karıştırarak kavur."]},
  {n:"Paella", m:"İspanyol mutfağı", t:60, p:4, tag:["dunya"], k:["pirinc:2 su bardağı","tavuk:300 g","kapya:1 adet","bezelye:0.5 su bardağı","domates:2 adet","sogan:1 adet","sarimsak:2 diş","zeytinyagi:4 yemek kaşığı","tuz:1 tatlı kaşığı","su:4 su bardağı"], s:["Tavuğu geniş bir tavada zeytinyağında kızart.","Soğan, sarımsak ve şerit doğranmış biberi ekleyip kavur, rendelenmiş domatesi ekle.","Pirinci ekleyip 2 dakika çevir, 4 su bardağı sıcak su ve tuzu ekle.","Karıştırmadan, kısık ateşte suyunu çekene kadar 20 dakika pişir; bezelyeyi son 5 dakikada ekle."], note:"Bir tutam safran eklersen hem rengi hem kokusu orijinaline yaklaşır."},
  {n:"Ratatouille", m:"Fransız mutfağı", t:60, p:4, tag:["dunya"], k:["patlican:1 adet","kabak:2 adet","kapya:2 adet","domates:3 adet","sogan:1 adet","sarimsak:2 diş","zeytinyagi:4 yemek kaşığı","tuz:1 tatlı kaşığı","karabiber:1 çay kaşığı"], s:["Soğan ve sarımsağı zeytinyağında kavur, 1 domatesi rendeleyip ekleyerek sos yap ve fırın kabına yay.","Patlıcan, kabak, kalan domates ve biberi ince halka doğra.","Sebzeleri sosun üzerine sırayla, birbirine yaslayarak diz.","Zeytinyağı, tuz ve karabiber gezdirip 180 °C fırında 45 dakika pişir."]},
  {n:"Falafel", m:"Orta Doğu mutfağı", t:40, p:4, tag:["dunya"], k:["nohut:2 su bardağı","sogan:1 adet","sarimsak:2 diş","maydanoz:1 demet","un:2 yemek kaşığı","tuz:1 tatlı kaşığı","yag:2 su bardağı"], s:["Bir gece ıslatılmış çiğ nohudu süz.","Nohut, soğan, sarımsak, maydanoz, un ve tuzu rondoda iri bir hamur olana kadar çek.","Ceviz büyüklüğünde toplar yapıp hafifçe bastır.","Kızgın yağda iki yüzü kızarana kadar kızart."], note:"Nohut haşlanmamalı, sadece bir gece ıslatılmalı; yoksa falafel dağılır."},
  {n:"Shakshuka", m:"Orta Doğu mutfağı", t:25, p:4, tag:["dunya"], k:["domates:4 adet","kapya:1 adet","sogan:1 adet","sarimsak:2 diş","yumurta:4 adet","zeytinyagi:2 yemek kaşığı","pul_biber:1 çay kaşığı","tuz:1 çay kaşığı"], s:["Soğan, biber ve sarımsağı zeytinyağında kavur.","Rendelenmiş domates, pul biber ve tuzu ekleyip 10 dakika koyulaşana kadar pişir.","Sosun içinde dört çukur açıp yumurtaları kır.","Kapağı kapalı, yumurtaların beyazı pişene kadar 5 dakika pişir."]},
  {n:"Yunan salatası", o:"Greek Salad", m:"Yunan mutfağı", t:15, p:4, tag:["dunya"], k:["domates:3 adet","salatalik:2 adet","biber:1 adet","sogan:1 adet","zeytin:0.5 su bardağı","peynir:150 g","zeytinyagi:4 yemek kaşığı","tuz:1 çay kaşığı"], s:["Domates, salatalık ve biberi iri doğra, soğanı halka doğra.","Zeytinleri ekle.","Beyaz peyniri büyük bir dilim olarak üzerine koy.","Zeytinyağı ve tuz gezdirip servis et."]},

  {n:"Brownie", m:"Amerikan mutfağı", t:40, p:9, tag:["tatli"], k:["cikolata:150 g","tereyagi:125 g","seker:1 su bardağı","yumurta:3 adet","un:0.75 su bardağı","kakao:2 yemek kaşığı","ceviz:0.5 su bardağı"], s:["Çikolata ve tereyağını benmari usulü erit.","Yumurta ve şekeri çırpıp eritilmiş çikolatayı ekle.","Un, kakao ve cevizi ekleyip sadece karışana kadar karıştır.","Yağlı kâğıt serili kalıba dök, 175 °C fırında 25 dakika pişir; ortası hafif nemli kalmalı."]},
  {n:"Cheesecake", m:"Amerikan mutfağı", t:100, p:8, tag:["tatli"], k:["biskuvi:200 g","tereyagi:80 g","labne:600 g","seker:1 su bardağı","yumurta:3 adet","krema:1 su bardağı","un:2 yemek kaşığı","vanilin:1 paket","limon:0.5 adet"], s:["Bisküviyi ufala, eritilmiş tereyağıyla karıştırıp kelepçeli kalıbın tabanına bastır.","Labne, şeker, yumurta, krema, un, vanilin ve limon suyunu pürüzsüz olana kadar karıştır.","Karışımı tabanın üzerine dök.","170 °C fırında 55 dakika pişir, fırını kapatıp kapağı aralık 30 dakika beklet.","Buzdolabında en az 4 saat dinlendir."], note:"Üzerine çilek ya da vişne sosu dökerek servis edebilirsin."},
  {n:"Tiramisu", m:"İtalyan mutfağı", t:30, p:8, tag:["tatli"], k:["biskuvi:200 g","labne:400 g","krema:1 su bardağı","seker:0.5 su bardağı","granul_kahve:2 yemek kaşığı","su:1 su bardağı","kakao:2 yemek kaşığı"], s:["Granül kahveyi 1 su bardağı sıcak suda erit ve soğut.","Labne, krema ve şekeri mikserle koyu bir krema olana kadar çırp.","Bisküvileri kahveye kısaca batırıp kabın tabanına diz, üzerine kremanın yarısını yay.","Bir kat daha bisküvi ve krema yap.","Üzerine kakao eleyip buzdolabında en az 4 saat beklet."], note:"Orijinalinde mascarpone peyniri ve kedi dili bisküvi kullanılır."},
  {n:"Islak kek", t:50, p:9, tag:["tatli"], k:["un:1.5 su bardağı","seker:1.5 su bardağı","yumurta:3 adet","sut:1.5 su bardağı","yag:0.75 su bardağı","kakao:4 yemek kaşığı","kabartma_tozu:1 paket","vanilin:1 paket"], s:["Sos için yarım su bardağı süt, yarım su bardağı şeker, 1 kaşık kakao ve biraz yağı kaynatıp ayır.","Yumurta ve kalan şekeri köpürene kadar çırp, kalan süt ve yağı ekle.","Un, kalan kakao, kabartma tozu ve vanilini eleyerek ekleyip karıştır.","Kalıba dök, 175 °C fırında 35 dakika pişir.","Fırından çıkan sıcak keki çatalla delip üzerine sosu dök."]},
  {n:"Yaş pasta", t:120, p:8, tag:["tatli"], k:["yumurta:4 adet","seker:1.5 su bardağı","un:1 su bardağı","kabartma_tozu:0.5 paket","sut:2.5 su bardağı","nisasta:2 yemek kaşığı","vanilin:1 paket","krema:1 su bardağı","muz:2 adet","cilek:1 su bardağı"], s:["Pandispanya için yumurta ve 1 su bardağı şekeri 5 dakika köpürene kadar çırp, un ve kabartma tozunu eleyerek yavaşça karıştır.","Kalıba dök, 170 °C fırında 30 dakika pişir ve soğut.","Krema için 2 su bardağı süt, kalan şeker, nişasta ve vanilini koyulaşana kadar pişirip soğut, çırpılmış kremayla karıştır.","Keki ikiye kes, kalan sütle ıslat; arasına krema, muz ve çilek koy.","Üstünü ve yanlarını kremayla kaplayıp meyveyle süsle, buzdolabında 2 saat dinlendir."]},
  {n:"Magnolia", t:30, p:6, tag:["tatli"], k:["sut:4 su bardağı","un:3 yemek kaşığı","nisasta:2 yemek kaşığı","seker:0.75 su bardağı","yumurta:1 adet","krema:1 su bardağı","vanilin:1 paket","biskuvi:150 g","cilek:1 su bardağı"], s:["Süt, un, nişasta, şeker ve yumurta sarısını tencerede çırparak karıştır.","Orta ateşte sürekli karıştırarak koyulaşana kadar pişir, vanilini ekleyip soğut.","Soğuyan muhallebiyi kremayla mikserde çırp.","Kaselere sırayla ufalanmış bisküvi, krema ve doğranmış çilek koy; buzdolabında 2 saat beklet."]},
  {n:"Supangle", t:25, p:6, tag:["tatli"], k:["sut:4 su bardağı","seker:1 su bardağı","un:3 yemek kaşığı","nisasta:2 yemek kaşığı","kakao:3 yemek kaşığı","cikolata:50 g","tereyagi:1 yemek kaşığı","biskuvi:6 adet"], s:["Süt, şeker, un, nişasta ve kakaoyu tencerede çırparak karıştır.","Orta ateşte sürekli karıştırarak koyulaşana kadar pişir.","Ocaktan alıp çikolata ve tereyağını ekleyip eriyene kadar karıştır.","Kaselerin dibine bisküvi koyup üzerine puding dök, soğuyunca buzdolabına kaldır."]},
  {n:"Trileçe", m:"Balkan mutfağı", t:60, p:8, tag:["tatli"], k:["yumurta:4 adet","seker:1.5 su bardağı","un:1 su bardağı","kabartma_tozu:1 paket","sut:2 su bardağı","krema:1 su bardağı"], s:["Yumurta ve 1 su bardağı şekeri köpürene kadar çırp, un ve kabartma tozunu ekleyip karıştır.","Kalıba dök, 170 °C fırında 25 dakika pişir.","Süt ve kremayı karıştır, ılık keki çatalla delip üzerine dök ve emmesini bekle.","Kalan şekeri tavada karamelize edip birkaç kaşık süt ekleyerek sos yap ve keki kapla; buzdolabında dinlendir."]},
  {n:"Baklava", t:90, p:12, tag:["tatli"], k:["baklava_yufkasi:500 g","ceviz:2 su bardağı","tereyagi:250 g","seker:3 su bardağı","su:2.5 su bardağı","limon:0.5 adet"], s:["Şerbet için şeker ve suyu 15 dakika kaynat, limon suyunu ekleyip soğumaya bırak.","Tepsiyi yağla; yufkaların yarısını her katı eritilmiş tereyağıyla fırçalayarak diz.","Dövülmüş cevizi yay, kalan yufkaları aynı şekilde üzerine diz.","Baklava dilimi şeklinde kes, üzerine kalan tereyağını dök ve 180 °C fırında 40 dakika pişir.","Sıcak baklavaya soğuk şerbeti dök, en az 2 saat beklet."]},
